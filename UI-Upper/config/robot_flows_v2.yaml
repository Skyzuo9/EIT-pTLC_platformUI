version: 2
config_version: "2.2.0-orchestration"

# 地轨 (地轨轴11Y) 工位位置映射: route_group -> 地轨绝对位置码。
# 机器人坐在地轨上, 进入某工位前须先把地轨移到该工位 (见 RoutePlanner 自动注入)。
# 位置码对齐 legacy HMI_地轨轴11Y.position[1..6]:
#   1=上样点样位, 2=刮板拍照位, 3=收集工位, 4=取工具位, 5=展开缸位, 6=取放收集组/暂存/仓库位。
# 注意: 具体数值与分组需按实机标定确认 (见计划"待确认项")。
rail_stations:
  spotting-put: 1
  spotting-pick: 1
  feed-lift-pick: 1          # 升降上料在上样区, 待标定
  scrape-plate-put: 2
  scrape-plate-pick: 2
  scrape-holder-put: 2
  scrape-holder-pick: 2
  waste-put: 2               # 废料下料, 待标定
  collect-bottle-put: 3
  collect-bottle-pick: 3
  collect-holder-put: 3
  collect-holder-pick: 3
  tool-change: 4
  tank-a: 5
  tank-b: 5
  collector-group-rack: 6
  bottle-group-rack: 6
  collector-group-staging-put: 6
  collector-group-staging-pick: 6
  bottle-group-staging-put: 6
  bottle-group-staging-pick: 6
  collector-slot: 6
  bottle-slot: 6
  collector-return-slot: 6
  test-only: 4

