      - {id: home-open-gripper, type: tool_action, action: rotary-up}
      - {id: move-to-p2, type: move, role: target, motion: move_j, profile: tool-ready-in}
      - {id: p2-close-gripper, type: tool_action, action: rotary-down}
      - {id: return-home, type: move, role: home, motion: move_j, profile: home-return}
