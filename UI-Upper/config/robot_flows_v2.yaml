templates:
  tool.pick:
    description: "Legacy-equivalent GetTool_Path"
    selector: tool_id
    selector_param: tool_id
    route_groups: [tool-change]
    entry_role: home
    exit_role: home
    anchor_tolerance: {joint_deg: 2.0, position_mm: 5.0, rotation_deg: 5.0}
    steps:
      - {id: enter-ready, type: move, role: ready, motion: move_j, profile: tool-ready-in}
      - {id: enter-high, type: move, role: approach_high, motion: move_l, profile: tool-high-in}
      - {id: enter-near, type: move, role: approach_near, motion: move_l, profile: tool-near-in}
      - {id: enter-target, type: move, role: target, motion: move_l, profile: tool-target-in}
      - {id: quick-change-lock, type: tool_action, action: quick-change-lock}
      - {id: tool-change-aux-on, type: tool_action, action: tool-change-aux-on}
      - {id: retreat-near, type: move, role: approach_near, motion: move_l, profile: tool-near-out}
      - {id: retreat-high, type: move, role: approach_high, motion: move_l, profile: tool-high-out}
      - {id: leave-ready, type: move, role: ready, motion: move_j, profile: tool-ready-out}
      - {id: legacy-settle, type: wait, duration_ms: 500}
      - {id: return-home, type: move, role: home, motion: move_j, profile: home-return}
  tool.put:
    description: "Legacy-equivalent PutTool_Path"
    selector: tool_id
    selector_param: tool_id
    route_groups: [tool-change]
    entry_role: home
    exit_role: home
    anchor_tolerance: {joint_deg: 2.0, position_mm: 5.0, rotation_deg: 5.0}
    steps:
      - {id: enter-ready, type: move, role: ready, motion: move_j, profile: tool-ready-in}
      - {id: put-extension, type: extension, extension: put_after_ready}
      - {id: enter-high, type: move, role: approach_high, motion: move_l, profile: tool-high-in}
      - {id: enter-near, type: move, role: approach_near, motion: move_l, profile: tool-near-in}
      - {id: enter-target, type: move, role: target, motion: move_l, profile: tool-target-in}
      - {id: quick-change-release, type: tool_action, action: quick-change-release}
      - {id: tool-change-aux-off, type: tool_action, action: tool-change-aux-off}
      - {id: retreat-near, type: move, role: approach_near, motion: move_l, profile: tool-near-out}
      - {id: retreat-high, type: move, role: approach_high, motion: move_l, profile: tool-high-out}
      - {id: leave-ready, type: move, role: ready, motion: move_j, profile: tool-ready-out}
      - {id: return-home, type: move, role: home, motion: move_j, profile: home-return}
  tank.pick:
    description: "Pick a plate from tank 1..8 with preserved route groups"
    selector: tank_id
    selector_param: tank_id
    route_groups: [tank-a, tank-b]
    entry_role: home
    exit_role: home
