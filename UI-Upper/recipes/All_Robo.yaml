name: All_Robo
stages:
- name: spotting
  enabled: true
  params:
    sample_volume_ml: 1.0
    air_buffer_ml: 1.0
    wash_volume_ml: 1.0
    source_x: 6
    source_y: 5
    cleaning_count: 1
- name: before_photo
  enabled: true
  params: {}
- name: develop
  enabled: true
  params:
    rinse_mode: cylinder
    target_tank: 4
    solvent_volume_ml: 1.0
    solvent_ratio_1: 0.0
    solvent_ratio_2: 0.0
    solvent_ratio_3: 1.0
    solvent_ratio_4: 0.0
    solvent_ratio_5: 0.0
    develop_duration_min: 50.0
    rinse_repeat_count: 1
    up_liquid_repeat_count: 1
- name: scrape
  enabled: true
  params:
    num_passes: 1
    total_depth_mm: 0.5
    feed_rate: 0
    plunge_rate: 0
    path_strategy: contour
    keep_ratio: 0.5
    overlap_ratio: 0.0
- name: collect
  enabled: true
  params:
    solvent_volume_ml: 1.0
    solvent_channel: 2
    liquid_repeat_count: 1
    powder_return_slot: 0
