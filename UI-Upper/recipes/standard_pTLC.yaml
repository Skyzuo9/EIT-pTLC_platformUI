name: standard_pTLC
stages:
- name: spotting
  enabled: true
  params:
    sample_volume_ml: 5.0
    air_buffer_ml: 3.0
    wash_volume_ml: 25.0
    source_x: 1
    source_y: 1
    cleaning_count: 3
- name: before_photo
  enabled: true
  params: {}
- name: develop
  enabled: true
  params:
    rinse_mode: cylinder
    target_tank: 1
    solvent_volume_ml: 2.0
    solvent_ratio_1: 0.0
    solvent_ratio_2: 1.0
    solvent_ratio_3: 0.0
    solvent_ratio_4: 0.0
    solvent_ratio_5: 0.0
    develop_duration_min: 3.0
    rinse_repeat_count: 1
    up_liquid_repeat_count: 1
- name: scrape
  enabled: true
  params:
    # CNC 工艺参数（0/空=走 config.yaml 全局默认，非 0 值覆盖全局配置）
    # num_passes: 3           # 刮取次数
    # total_depth_mm: 1.0     # 总深度 mm
    # feed_rate: 800           # 刮取进给 mm/min
    # plunge_rate: 200         # 下刀进给 mm/min
    # path_strategy: contour   # zigzag | boustrophedon | contour
    # keep_ratio: 1.0          # contour 策略保留比例
    # overlap_ratio: 0.8       # 路径重叠率
- name: collect
  enabled: true
  params:
    solvent_volume_ml: 2.0
    solvent_channel: 2
    liquid_repeat_count: 1
