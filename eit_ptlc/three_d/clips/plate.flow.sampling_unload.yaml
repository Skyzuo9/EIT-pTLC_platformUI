schema: ptlc.clip/v3
name: plate.flow.sampling_unload
label: 上样-下料
description: '由 PointRegistry 与上位机 operation 编译; 禁止手工填写生产关节角。显式假设: 本段开始时已挂 1 号刀, 机械臂在
  P1 安全位。板的落点由编译期的取放基准点静态定出(见 clip_compiler.PLATE_POINT_SLOT), 以 plate 原语写进片段; 实时页则由
  PlateBinding 按调度器账本跟手, 两条链互不干涉。'
operation:
  name: sampling_unload
  inputs: {}
assumptions:
  vision:
    voff_rz:
      valid: true
      dx_mm: 0.0
      dy_mm: 0.0
      drz_deg: 0.0
      err: 0
    voff_xy:
      valid: true
      dx_mm: 0.0
      dy_mm: 0.0
      drz_deg: 0.0
      err: 0
source:
  operation: config/operation/01_sampling/sampling_unload.yaml
  referencePointHash: 4b62a7049b8df0c5e0e8d34920f8cb64695f6dafe73eb04960c3301f9991c673
