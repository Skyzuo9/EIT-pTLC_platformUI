    dev_t2_cyl1: 1.0
    dev_t2_cyl2: 1.0
    dev_t2_cyl3: 1.0
    dev_t2_cyl4: 1.0
steps:
- label: 起手·装吸盘
  dur: 0.0
  do:
    tool:
      action: lock
      id: TOOL_SUCTION
      snap: true
- label: 板在位
  at: 0
  dur: 0
  do:
    plate:
      id: plate
      at: spot_seat
- label: 点样7Y·移到放板位
  dur: 1.12
  ease: inout
  do:
    axis:
      id: axis_7y
      to_mm: 56.0
- label: sampling.place_release 松开/缩回
  dur: 0.5
  ease: inout
  do:
    actuator:
      id: smp_locator
      to: 0.0
- label: 地轨到位1
  dur: 1.66
  ease: inout
  do:
    axis:
      id: axis_11y
      to_mm: 168.0
- label: 上样点样准备点
  dur: 3.84
  ease: inout
  do:
    robot_point:
      id: robot-main.area-3-ready
      motion: move_j
- label: 吸盘上翻(托板朝上)
  dur: 5.0
  ease: inout
  do:
    actuator:
      id: rob_flip_suction
      to: 1.0
- label: 点样取板·远接近
  dur: 4.0
  ease: linear
  do:
    robot_point:
      id: spotting.pick.approach_far
      motion: move_l
- label: 点样取板·近接近
  dur: 4.0
  ease: linear
  do:
    robot_point:
      id: spotting.pick.approach_near
      motion: move_l
- label: 点样放板位
  dur: 1.117
  ease: linear
  do:
    robot_point:
      id: robot-main.area-3-1
      motion: move_l
- label: 吸盘吸气·板跟手
  dur: 0.35
  do:
    plate:
      id: plate
      carry: true
      from: spot_seat
- label: 点样取板·近退离
  dur: 0.681
  ease: linear
  do:
    robot_point:
      id: spotting.pick.retreat_near
      motion: move_l
- label: 点样取板·远退离
  dur: 2.604
  ease: linear
  do:
    robot_point:
      id: spotting.pick.retreat_far
      motion: move_l
- label: 上样点样准备点
  dur: 0.844
  ease: inout
  do:
    robot_point:
      id: robot-main.area-3-ready
      motion: move_j
- label: 原点 (Home)
  dur: 4.0
  ease: inout
  do:
    robot_point:
      id: robot-main.home
      motion: move_j
