schema: ptlc.clip/v3
name: flow.collect_cycle
label: 收集-周期 (准备 -> 上料 -> 执行 -> 下料)
description: '由 PointRegistry 与上位机 operation 编译; 禁止手工填写生产关节角。显式假设: 本段开始时已挂 3 号刀, 机械臂在
  P1 安全位。板的落点由编译期的取放基准点静态定出(见 clip_compiler.PLATE_POINT_SLOT), 以 plate 原语写进片段; 实时页则由
  PlateBinding 按调度器账本跟手, 两条链互不干涉。'
operation:
  name: collect_cycle
  inputs:
    collector_slot: 1
    bottle_slot: 1
    solvent_volume_ml: 0.1
    liquid_repeat_count: 1
assumptions:
  vision:
    voff_rz:
      valid: true
      dx_mm: 0.0
      dy_mm: 0.0
      drz_deg: 0.0
      err: 0
    voff_xy:
      valid: true
      dx_mm: 0.0
      dy_mm: 0.0
      drz_deg: 0.0
      err: 0
flowNotes:
- 起手挂 3 号刀 —— 按流程首个 robot_tool_ensure(needed=3) 推断(flow_discovery.infer_initial_tool)
- '起手态 ps_rotate=1: 同 collect_load'
- '起手态 powder_scrape_holder=768mm³(满刮取 ×1): 同 collect_load'
