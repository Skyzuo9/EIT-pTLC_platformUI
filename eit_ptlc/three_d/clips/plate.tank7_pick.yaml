steps:
- label: 起手·装吸盘
  dur: 0.0
  do:
    tool:
      action: lock
      id: TOOL_SUCTION
      snap: true
- label: 板在位
  at: 0
  dur: 0
  do:
    plate:
      id: plate
      at: tank:7
- label: 地轨到位5
  dur: 0.5
  ease: inout
  do:
    axis:
      id: axis_11y
      to_mm: 600.0
- label: 吸盘下翻(持板朝下)
  dur: 5.0
  ease: inout
  do:
    actuator:
      id: rob_flip_suction
      to: 0.0
- label: 展开缸准备点
  dur: 4.0
  ease: inout
  do:
    robot_point:
      id: robot-main.area-2-ready
      motion: move_j
- label: 7号展开缸·远接近
  dur: 3.576
  ease: linear
  do:
    robot_point:
      id: tank.7.approach_far
      motion: move_l
- label: 7号展开缸·中接近
  dur: 1.094
  ease: linear
  do:
    robot_point:
      id: tank.7.approach_mid
      motion: move_l
- label: 7号展开缸·近接近
  dur: 4.0
  ease: linear
  do:
    robot_point:
      id: tank.7.approach_near
      motion: move_l
- label: 7号展开缸
  dur: 0.621
  ease: linear
  do:
    robot_point:
      id: robot-main.area-2-7
      motion: move_l
- label: 吸盘吸气·板跟手
  dur: 0.35
  do:
    plate:
      id: plate
      carry: true
      from: tank:7
- label: 7号展开缸·近接近
  dur: 0.497
  ease: linear
  do:
    robot_point:
      id: tank.7.approach_near
      motion: move_l
- label: 7号展开缸·中接近
  dur: 2.743
  ease: linear
  do:
    robot_point:
      id: tank.7.approach_mid
      motion: move_l
- label: 7号展开缸·远接近
  dur: 0.82
  ease: linear
  do:
    robot_point:
      id: tank.7.approach_far
      motion: move_l
- label: 展开缸准备点
  dur: 1.43
  ease: inout
  do:
    robot_point:
      id: robot-main.area-2-ready
      motion: move_j
- label: 原点 (Home)
  dur: 4.0
  ease: inout
  do:
    robot_point:
      id: robot-main.home
      motion: move_j
