steps:
- label: 起手·装吸盘
  dur: 0.0
  do:
    tool:
      action: lock
      id: TOOL_SUCTION
      snap: true
- label: 板在位
  at: 0
  dur: 0
  do:
    plate:
      id: plate
      at: scrape_table
- label: 地轨到位2
  dur: 1.66
  ease: inout
  do:
    axis:
      id: axis_11y
      to_mm: 168.0
- label: photoscrape.press_cylinder 松开/缩回
  dur: 0.5
  ease: inout
  do:
    actuator:
      id: ps_press
      to: 0.0
- label: photoscrape.locate_cylinder 松开/缩回
  dur: 0.5
  ease: inout
  do:
    actuator:
      id: ps_locator
      to: 0.0
- label: 刮板台准备点
  dur: 1.509
  ease: inout
  do:
    robot_point:
      id: robot-main.area-9-ready
      motion: move_j
- label: 吸盘上翻(托板朝上)
  dur: 5.0
  ease: inout
  do:
    actuator:
      id: rob_flip_suction
      to: 1.0
- label: 刮板台取板·远接近
  dur: 4.0
  ease: linear
  do:
    robot_point:
      id: scrape.plate-pick.approach_far
      motion: move_l
- label: 刮板台取板·近接近
  dur: 3.3
  ease: linear
  do:
    robot_point:
      id: scrape.plate-pick.approach_near
      motion: move_l
- label: 刮板台取板位
  dur: 1.24
  ease: linear
  do:
    robot_point:
      id: robot-main.area-9-2
      motion: move_l
- label: 吸盘吸气·板跟手
  dur: 0.35
  do:
    plate:
      id: plate
      carry: true
      from: scrape_table
- label: 刮板台取板·近退离
