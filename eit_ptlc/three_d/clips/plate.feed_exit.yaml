steps:
- label: 起手·装吸盘
  dur: 0.0
  do:
    tool:
      action: lock
      id: TOOL_SUCTION
      snap: true
- label: 板在位(起手)
  at: 0
  dur: 0
  do:
    plate:
      id: plate
      at: feedlift
- label: 板挂上吸盘
  at: 0
  dur: 0
  do:
    plate:
      id: plate
      carry: true
      from: feedlift
- label: 地轨到位1
  dur: 1.66
  ease: inout
  do:
    axis:
      id: axis_11y
      to_mm: 168.0
- label: 升降上料取料位·近接近
  dur: 0.35
  ease: linear
  do:
    robot_point:
      id: feed-lift.approach_near
      motion: move_l
- label: 升降上料取料位·远接近
  dur: 2.098
  ease: linear
  do:
    robot_point:
      id: feed-lift.approach_far
      motion: move_l
- label: 升降上料准备点
  dur: 0.718
  ease: inout
  do:
    robot_point:
      id: robot-main.area-4-ready
      motion: move_j
- label: 原点 (Home)
  dur: 1.89
  ease: inout
  do:
    robot_point:
      id: robot-main.home
      motion: move_j
