    dev_t1_cyl4: 1.0
    dev_t2_cyl1: 1.0
    dev_t2_cyl2: 1.0
    dev_t2_cyl3: 1.0
    dev_t2_cyl4: 1.0
steps:
- label: 起手·装吸盘
  dur: 0.0
  do:
    tool:
      action: lock
      id: TOOL_SUCTION
      snap: true
- label: '人工确认: {''lit'': ''刮痕标定确认: ① 刮板夹具已放入一块**空白牺牲板**(标定会在板上刮出图案, 板将报废) ② 接粉收集桶已放好(刮取动作同跑收集路径,
    无桶则粉末散落)。确认继续?''}'
  dur: 0.35
  do:
    wait: {}
- label: 遮光气缸·回上位
  dur: 0.5
  ease: inout
  do:
    actuator:
      id: ps_shade
      to: 0.0
- label: 拍照8Y·回放板位
  dur: 0.4
  ease: inout
  do:
    axis:
      id: axis_8y
      to_mm: 0.0
- label: staging_a.locator_a 夹紧/伸出
  dur: 0.5
  ease: inout
  do:
    actuator:
      id: sta_powder_locator
      to: 1.0
- label: photoscrape.locate_cylinder 夹紧/伸出
  dur: 0.5
  ease: inout
  do:
    actuator:
      id: ps_locator
      to: 1.0
- label: photoscrape.press_cylinder 夹紧/伸出
  dur: 0.5
  ease: inout
  do:
    actuator:
      id: ps_press
      to: 1.0
- label: 拍照8Y·板送进暗箱
  dur: 3.5
  ease: inout
  do:
    axis:
      id: axis_8y
      to_mm: 420.0
- label: 遮光气缸·落下
  dur: 0.5
  ease: inout
  do:
    actuator:
      id: ps_shade
      to: 1.0
- label: 刮板台·相机曝光
  dur: 0.3
  do:
    wait: {}
- label: 遮光气缸·回上位
  dur: 0.5
  ease: inout
  do:
    actuator:
      id: ps_shade
      to: 0.0
- label: 拍照8Y·板退出暗箱
  dur: 3.5
  ease: inout
  do:
    axis:
      id: axis_8y
      to_mm: 0.0
- label: '人工确认: {''lit'': ''刮痕标定轮次门 — 由「刮痕标定」面板自动应答(测量上一轮 → 写回 plate_origin → 生成下一轮图案)。人工介入请填
    action=finish 收尾。''}'
  dur: 0.35
  do:
    wait: {}
- label: 旋转气缸·翻料倒粉
  dur: 0.5
  ease: inout
  do:
    actuator:
      id: ps_rotate
      to: 1.0
- label: staging_a.locator_a 松开/缩回
  dur: 0.5
  ease: inout
  do:
    actuator:
      id: sta_powder_locator
      to: 0.0
- label: '人工确认: {''lit'': ''翻料完成, 接粉桶定位气缸已松开 —— 请取下接粉桶。确认后收集器翻回复位。''}'
  dur: 0.35
  do:
    wait: {}
- label: 旋转气缸·复位到刮取位
  dur: 0.5
  ease: inout
  do:
    actuator:
      id: ps_rotate
      to: 0.0
- label: photoscrape.press_cylinder 松开/缩回
  dur: 0.5
  ease: inout
  do:
    actuator:
      id: ps_press
      to: 0.0
- label: photoscrape.locate_cylinder 松开/缩回
  dur: 0.5
  ease: inout
  do:
    actuator:
      id: ps_locator
      to: 0.0
compiled:
  moveLTrajectories: {}
  staleJointPoints: []
  plateAnchorChecks: []
  dataOnlyMechanisms:
  - sta_powder_locator
