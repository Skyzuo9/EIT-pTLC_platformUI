steps:
- label: 起手·装吸盘
  dur: 0.0
  do:
    tool:
      action: lock
      id: TOOL_SUCTION
      snap: true
- label: 板(起手时已在机器人手上)
  at: 0
  dur: 0
  do:
    plate:
      id: plate
      carry: true
      from: scrape_table
- label: 遮光气缸·回上位
  dur: 0.5
  ease: inout
  do:
    actuator:
      id: ps_shade
      to: 0.0
- label: 拍照8Y·回放板位
  dur: 0.4
  ease: inout
  do:
    axis:
      id: axis_8y
      to_mm: 0.0
- label: 地轨到位2
  dur: 1.66
  ease: inout
  do:
    axis:
      id: axis_11y
      to_mm: 168.0
- label: 刮板台准备点
  dur: 1.509
  ease: inout
  do:
    robot_point:
      id: robot-main.area-9-ready
      motion: move_j
- label: 吸盘上翻(托板朝上)
  dur: 5.0
  ease: inout
  do:
    actuator:
      id: rob_flip_suction
      to: 1.0
- label: 刮板台准备点
  dur: 0.35
  ease: inout
  do:
    robot_point:
      id: robot-main.area-9-ready
      motion: move_j
- label: 刮板台放板·远接近
  dur: 4.0
  ease: linear
  do:
    robot_point:
      id: scrape.plate-put.approach_far
      motion: move_l
- label: 刮板台放板·近接近
  dur: 3.3
  ease: linear
  do:
    robot_point:
      id: scrape.plate-put.approach_near
      motion: move_l
- label: 刮板台取板位
