schema: ptlc.clip/v3
name: flow.photoscrape_before_photo_cycle
label: 拍照刮板-before拍照周期 (准备 -> 上料 -> 拍照 -> 下料)
description: '由 PointRegistry 与上位机 operation 编译; 禁止手工填写生产关节角。显式假设: 本段开始时已挂 1 号刀, 机械臂在
  P1 安全位。板的落点由编译期的取放基准点静态定出(见 clip_compiler.PLATE_POINT_SLOT), 以 plate 原语写进片段; 实时页则由
  PlateBinding 按调度器账本跟手, 两条链互不干涉。'
operation:
  name: photoscrape_before_photo_cycle
  inputs:
    sample_id: ''
    save_dir: ''
    before_path: ''
assumptions:
  vision:
    voff_rz:
      valid: true
      dx_mm: 0.0
      dy_mm: 0.0
      drz_deg: 0.0
      err: 0
    voff_xy:
      valid: true
      dx_mm: 0.0
      dy_mm: 0.0
      drz_deg: 0.0
      err: 0
