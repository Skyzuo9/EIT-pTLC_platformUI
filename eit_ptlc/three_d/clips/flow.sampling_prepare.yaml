schema: ptlc.clip/v3
name: flow.sampling_prepare
label: 上样-准备
description: '由 PointRegistry 与上位机 operation 编译; 禁止手工填写生产关节角。显式假设: 本段开始时已挂 1 号刀, 机械臂在
  P1 安全位。板的落点由编译期的取放基准点静态定出(见 clip_compiler.PLATE_POINT_SLOT), 以 plate 原语写进片段; 实时页则由
  PlateBinding 按调度器账本跟手, 两条链互不干涉。'
operation:
  name: sampling_prepare
  inputs:
    flush_volume_ml: 17.0
    outer_wash_volume_ml: 5.0
    spot_head_volume_ml: 3.0
    asp_speed: 250
    flush_disp_speed: 300
    spot_head_disp_speed: 100
    step_delay: 1500
assumptions:
  vision:
    voff_rz:
      valid: true
      dx_mm: 0.0
      dy_mm: 0.0
      drz_deg: 0.0
      err: 0
    voff_xy:
      valid: true
      dx_mm: 0.0
      dy_mm: 0.0
      drz_deg: 0.0
      err: 0
source:
  operation: config/operation/01_sampling/sampling_prepare.yaml
  referencePointHash: 4b62a7049b8df0c5e0e8d34920f8cb64695f6dafe73eb04960c3301f9991c673
  kinematicsCommit: 37730d08b08c74061ae10d4fa5565b4c4c914885
  calibrationVersion: cr5-ptlc-2026-08-01-rail-carriage-center
  railCalib:
    axis: axis_11y
    zeroOffsetMm: 500.0
    sign: -1
    rangeMm:
    - -54.9
    - 845.1
home:
  axis_mm:
    axis_11y: 500.0
    axis_9x: 335.0
    axis_10z: 0.0
  joints_deg:
  - -154.523621
  - -47.783794
  - 93.294029
  - 44.639656
  - -89.062752
  - 124.999908
  actuators:
    ps_rotate: 0.0
    ps_press: 0.0
    ps_locator: 0.0
    ps_shade: 0.0
    col_extend: 0.0
    col_lift: 0.0
    col_press: 0.0
    smp_locator: 0.0
    rob_flip_suction: 0.0
  linkages:
    rob_grip_plate96: 0.0
    rob_grip_vial: 0.0
    col_clamp: 0.0
    dev_t1_cyl1: 1.0
    dev_t1_cyl2: 1.0
    dev_t1_cyl3: 1.0
    dev_t1_cyl4: 1.0
    dev_t2_cyl1: 1.0
    dev_t2_cyl2: 1.0
    dev_t2_cyl3: 1.0
    dev_t2_cyl4: 1.0
  pump_ml:
    SMP: 0.0
  pump_port:
    SMP: 1
steps:
- label: 起手·装吸盘
  dur: 0.0
  do:
    tool:
      action: lock
      id: TOOL_SUCTION
      snap: true
- label: 上样5Z·抬针回零
  dur: 0.4
  ease: inout
  do:
    axis:
      id: axis_5z
      to_mm: 0.0
- label: 上样4X·回零
  dur: 0.4
  ease: inout
  do:
    axis:
      id: axis_4x
      to_mm: 0.0
- label: 点样6X·回零
  dur: 0.4
  ease: inout
  do:
    axis:
      id: axis_6x
      to_mm: 0.0
- label: 点样7Y·回零
  dur: 0.4
  ease: inout
  do:
    axis:
      id: axis_7y
      to_mm: 0.0
- label: 上样泵·阀→1号口
  dur: 0.4
  ease: inout
  do:
    pump_valve:
      id: SMP
      port: 1
- label: 上样泵·吸液 0.0 → 25.0 mL(实机 24s, 演示压到 20s)
  dur: 20.0
  ease: out
  do:
    pump:
      id: SMP
      to_ml: 25.0
- label: 上样泵·稳液 1.5s
  dur: 1.5
  do:
    wait: {}
- label: 上样泵·阀→3号口
  dur: 0.4
  ease: inout
  do:
    pump_valve:
      id: SMP
      port: 3
- label: 上样泵·排液 25.0 → 8.0 mL
  dur: 13.6
  ease: out
  do:
    pump:
      id: SMP
      to_ml: 8.0
- label: 上样泵·稳液 1.5s
  dur: 1.5
  do:
    wait: {}
- label: 上样泵·阀→2号口
  dur: 0.4
  ease: inout
  do:
    pump_valve:
      id: SMP
      port: 2
- label: 上样泵·排液 8.0 → 3.0 mL
  dur: 4.0
  ease: out
  do:
    pump:
      id: SMP
      to_ml: 3.0
- label: 上样泵·稳液 1.5s
  dur: 1.5
  do:
    wait: {}
- label: 上样泵·阀→3号口
  dur: 0.4
  ease: inout
  do:
    pump_valve:
      id: SMP
      port: 3
- label: 上样泵·排液 3.0 → 0.0 mL
  dur: 7.2
  ease: out
  do:
    pump:
      id: SMP
      to_ml: 0.0
- label: 上样泵·稳液 1.5s
  dur: 1.5
  do:
    wait: {}
- label: 点样7Y·移到放板位
  dur: 1.12
  ease: inout
  do:
    axis:
      id: axis_7y
      to_mm: 56.0
compiled:
