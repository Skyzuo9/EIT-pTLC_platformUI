steps:
- label: 起手·装吸盘
  dur: 0.0
  do:
    tool:
      action: lock
      id: TOOL_SUCTION
      snap: true
- label: 板在位
  at: 0
  dur: 0
  do:
    plate:
      id: plate
      at: feedlift
- label: 地轨到位1
  dur: 1.66
  ease: inout
  do:
    axis:
      id: axis_11y
      to_mm: 168.0
- label: 上料1Z·降轴至光电消失
  dur: 0.4
  ease: inout
  do:
    axis:
      id: axis_1z
      to_mm: 0.0
- label: 上料1Z·升轴到取料光电
  dur: 4.267
  ease: inout
  do:
    axis:
      id: axis_1z
      to_mm: 512.0
- label: 探测板堆张数
  dur: 0.4
  do:
    wait: {}
- label: 吸盘下翻(持板朝下)
  dur: 5.0
  ease: inout
  do:
    actuator:
      id: rob_flip_suction
      to: 0.0
- label: 升降上料准备点
  dur: 1.399
  ease: inout
  do:
    robot_point:
      id: robot-main.area-4-ready
      motion: move_j
- label: 升降上料取料位·远接近
  dur: 1.078
  ease: linear
  do:
    robot_point:
      id: feed-lift.approach_far
      motion: move_l
- label: 升降上料取料位·近接近
  dur: 2.098
  ease: linear
  do:
    robot_point:
      id: feed-lift.approach_near
      motion: move_l
- label: 升降上料取料位
  dur: 0.669
  ease: linear
  do:
    robot_point:
      id: robot-main.area-4-1
      motion: move_l
- label: 吸盘吸气·板跟手
  dur: 0.35
  do:
    plate:
      id: plate
      carry: true
      from: feedlift
- label: 上料1Z·降轴5mm让位
  dur: 0.4
  ease: inout
  do:
