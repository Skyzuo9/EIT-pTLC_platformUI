      action: lock
      id: TOOL_SUCTION
      snap: true
- label: 1号工具位·吸盘·高位接近
  dur: 3.51
  ease: linear
  do:
    robot_point:
      id: robot-main.tool-change.slot-1.approach-high
      motion: move_l
- label: 1号工具位·吸盘·近接近
  dur: 4.0
  ease: linear
  do:
    robot_point:
      id: robot-main.tool-change.slot-1.approach-near
