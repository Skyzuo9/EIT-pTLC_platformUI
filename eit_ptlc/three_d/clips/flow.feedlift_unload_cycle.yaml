steps:
- label: 起手·装吸盘
  dur: 0.0
  do:
    tool:
      action: lock
      id: TOOL_SUCTION
      snap: true
- label: 板(起手时已在机器人手上)
  at: 0
  dur: 0
  do:
    plate:
      id: plate
      carry: true
      from: waste
- label: 地轨到位1
  dur: 1.66
  ease: inout
  do:
    axis:
      id: axis_11y
      to_mm: 168.0
- label: 下料2Z·埋料至光电消失
  dur: 0.4
  ease: inout
  do:
    axis:
      id: axis_2z
      to_mm: 0.0
- label: 下料2Z·升到放废料位
  dur: 4.267
  ease: inout
  do:
    axis:
      id: axis_2z
      to_mm: 512.0
- label: 探测板堆张数
  dur: 0.4
  do:
    wait: {}
- label: 吸盘下翻(持板朝下)
  dur: 5.0
  ease: inout
  do:
    actuator:
      id: rob_flip_suction
      to: 0.0
- label: 升降上料准备点
  dur: 1.399
  ease: inout
  do:
    robot_point:
      id: robot-main.area-4-ready
      motion: move_j
- label: 废料放板位·远接近
  dur: 4.0
  ease: linear
  do:
    robot_point:
      id: waste.approach_far
      motion: move_l
- label: 废料放板位·近接近
  dur: 4.0
  ease: linear
  do:
    robot_point:
      id: waste.approach_near
      motion: move_l
- label: 废料放板位
  dur: 0.824
  ease: linear
  do:
    robot_point:
      id: robot-main.area-4-2
      motion: move_l
- label: 吸盘放气·板落位
  dur: 0.35
  do:
    plate:
      id: plate
      at: waste
- label: 废料放板位·近接近
  dur: 0.659
  ease: linear
  do:
    robot_point:
      id: waste.approach_near
      motion: move_l
- label: 废料放板位·远接近
  dur: 2.121
  ease: linear
  do:
    robot_point:
      id: waste.approach_far
      motion: move_l
- label: 升降上料准备点
  dur: 3.391
  ease: inout
  do:
    robot_point:
      id: robot-main.area-4-ready
      motion: move_j
- label: 原点 (Home)
  dur: 1.89
  ease: inout
  do:
    robot_point:
      id: robot-main.home
      motion: move_j
- label: 下料2Z·埋料至光电消失
  dur: 4.183
  ease: inout
  do:
    axis:
      id: axis_2z
      to_mm: 10.0
- label: 板并入仓内板堆(不再单独画)
  dur: 0.0
  do:
    plate:
      id: plate
      hide: true
- label: 下料2Z·埋料至光电消失·滑车续降到底
  dur: 0.4
  ease: inout
  do:
    axis:
      id: axis_2z
      to_mm: 0.0
