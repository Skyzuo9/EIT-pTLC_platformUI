steps:
- label: 起手·装吸盘
  dur: 0.0
  do:
    tool:
      action: lock
      id: TOOL_SUCTION
      snap: true
- label: 板在位(前置段已放入)
  at: 0
  dur: 0
  do:
    plate:
      id: plate
      at: tank:7
- label: 展开·溶剂前沿上行(压缩演示)
  dur: 8.0
  ease: linear
  do:
    wet:
      id: plate
      to: 1.0
- label: '人工确认: {''lit'': ''参考图采集失败, 本次液位检测不可用; 展开完成后确认开始 PLC L2 排液''}'
  dur: 0.35
  do:
    wait: {}
- label: 7号缸排液 60.0 → 0.0 mL
  dur: 10.0
  ease: out
  do:
    liquid:
      id: tank7
      to_ml: 0.0
compiled:
