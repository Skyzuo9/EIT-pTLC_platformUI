    col_extend: 0.0
    col_lift: 0.0
    col_press: 0.0
    smp_locator: 0.0
    rob_flip_suction: 0.0
  linkages:
    rob_grip_plate96: 0.0
    rob_grip_vial: 0.0
    col_clamp: 0.0
    dev_t1_cyl1: 1.0
    dev_t1_cyl2: 1.0
