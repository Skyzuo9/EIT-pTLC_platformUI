    axis_9x: 335.0
    axis_10z: 0.0
  joints_deg:
  - -154.523621
  - -47.783794
  - 93.294029
  - 44.639656
  - -89.062752
  - 124.999908
  actuators:
    ps_rotate: 0.0
    ps_press: 0.0
    ps_locator: 0.0
