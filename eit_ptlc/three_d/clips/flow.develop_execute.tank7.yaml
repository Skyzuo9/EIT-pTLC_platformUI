schema: ptlc.clip/v3
name: flow.develop_execute.tank7
label: 展开-执行 · 展缸号7
description: '由 PointRegistry 与上位机 operation 编译; 禁止手工填写生产关节角。显式假设: 本段开始时已挂 1 号刀, 机械臂在
  P1 安全位。板的落点由编译期的取放基准点静态定出(见 clip_compiler.PLATE_POINT_SLOT), 以 plate 原语写进片段; 实时页则由
  PlateBinding 按调度器账本跟手, 两条链互不干涉。'
operation:
  name: develop_execute
  inputs:
    tank: 7
    auto_drain: false
    dry_duration_s: 0.0
    wl_result: {}
    ref_result: {}
assumptions:
  vision:
    voff_rz:
      valid: true
      dx_mm: 0.0
      dy_mm: 0.0
      drz_deg: 0.0
      err: 0
    voff_xy:
      valid: true
      dx_mm: 0.0
      dy_mm: 0.0
      drz_deg: 0.0
      err: 0
flowNotes:
- '液位等待按润湿前沿表现: 0→14.7cm(板cm, 假设值出处见 WET_FRONT_TARGET_CM)匀速 8s; 真机是液位闭环等待(hard_cap
  3600s), 前沿高度那时由液位百分比与时间共同决定, 真值用实机对照'
- 条件分支按“条件成立”那一支编排; 实机按现场反馈选
source:
  operation: config/operation/02_develop/develop_execute.yaml
  referencePointHash: 4b62a7049b8df0c5e0e8d34920f8cb64695f6dafe73eb04960c3301f9991c673
