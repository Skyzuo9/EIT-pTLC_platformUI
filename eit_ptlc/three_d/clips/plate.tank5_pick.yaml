    dev_t1_cyl2: 1.0
    dev_t1_cyl3: 1.0
    dev_t1_cyl4: 1.0
    dev_t2_cyl1: 1.0
    dev_t2_cyl2: 1.0
    dev_t2_cyl3: 1.0
    dev_t2_cyl4: 1.0
steps:
- label: 起手·装吸盘
  dur: 0.0
  do:
    tool:
      action: lock
      id: TOOL_SUCTION
      snap: true
- label: 板在位
  at: 0
  dur: 0
  do:
    plate:
      id: plate
      at: tank:5
- label: 地轨到位5
  dur: 0.5
  ease: inout
  do:
    axis:
      id: axis_11y
      to_mm: 600.0
- label: 吸盘下翻(持板朝下)
  dur: 5.0
  ease: inout
  do:
    actuator:
      id: rob_flip_suction
      to: 0.0
- label: 展开缸准备点
  dur: 4.0
  ease: inout
  do:
    robot_point:
      id: robot-main.area-2-ready
      motion: move_j
- label: 5号展开缸·远接近
  dur: 3.552
  ease: linear
  do:
    robot_point:
      id: tank.5.approach_far
      motion: move_l
- label: 5号展开缸·中接近
  dur: 4.0
  ease: linear
  do:
    robot_point:
      id: tank.5.approach_mid
      motion: move_l
- label: 5号展开缸·近接近
  dur: 4.0
  ease: linear
  do:
    robot_point:
      id: tank.5.approach_near
      motion: move_l
- label: 5号展开缸
  dur: 0.501
  ease: linear
  do:
    robot_point:
      id: robot-main.area-2-5
      motion: move_l
- label: 吸盘吸气·板跟手
  dur: 0.35
  do:
    plate:
      id: plate
      carry: true
      from: tank:5
- label: 5号展开缸·近接近
  dur: 0.401
  ease: linear
  do:
    robot_point:
      id: tank.5.approach_near
      motion: move_l
- label: 5号展开缸·中接近
  dur: 2.733
  ease: linear
  do:
    robot_point:
      id: tank.5.approach_mid
      motion: move_l
- label: 5号展开缸·远接近
  dur: 4.0
  ease: linear
  do:
    robot_point:
      id: tank.5.approach_far
      motion: move_l
- label: 展开缸准备点
  dur: 1.421
  ease: inout
  do:
    robot_point:
      id: robot-main.area-2-ready
      motion: move_j
- label: 原点 (Home)
  dur: 4.0
  ease: inout
  do:
    robot_point:
      id: robot-main.home
      motion: move_j
