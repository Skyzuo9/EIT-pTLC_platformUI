schema: ptlc.clip/v3
name: flow.ensure_collector_staged
label: 耗材-粉末收集器就位保证 (读账本决策 -> 够用则跳过 / 否则条件换板)
description: '由 PointRegistry 与上位机 operation 编译; 禁止手工填写生产关节角。显式假设: 本段开始时已挂 1 号刀, 机械臂在
  P1 安全位。板的落点由编译期的取放基准点静态定出(见 clip_compiler.PLATE_POINT_SLOT), 以 plate 原语写进片段; 实时页则由
  PlateBinding 按调度器账本跟手, 两条链互不干涉。'
operation:
  name: ensure_collector_staged
  inputs:
    reserve_for: ''
    op: ''
    rack_slot: 0
    old_rack_slot: 0
    hole: 1
assumptions:
  vision:
    voff_rz:
      valid: true
      dx_mm: 0.0
      dy_mm: 0.0
      drz_deg: 0.0
      err: 0
    voff_xy:
      valid: true
      dx_mm: 0.0
      dy_mm: 0.0
      drz_deg: 0.0
      err: 0
flowNotes:
- 'ensure_collector_staged 的换板决策取显式假设 {''op'': ''SWAP'', ''rack_slot'': 1, ''old_rack_slot'':
  1, ''hole'': 1}(运行期由 material.plan_staging 给出)'
- 换刀已按 1 号刀 → 2 号刀编出实际轨迹
