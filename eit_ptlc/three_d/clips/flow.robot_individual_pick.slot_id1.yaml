steps:
- label: 起手·装小夹爪
  dur: 0.0
  do:
    tool:
      action: lock
      id: TOOL_VIAL
      snap: true
- label: INV_STAGING_A 显示
  at: 0
  dur: 0
  do:
    state:
      id: INV_STAGING_A
      value: true
- label: INV_STAGING_A_ITEM_1 显示
  at: 0
  dur: 0
  do:
    state:
      id: INV_STAGING_A_ITEM_1
      value: true
- label: 地轨到位2
  dur: 1.66
  ease: inout
  do:
    axis:
      id: axis_11y
      to_mm: 168.0
- label: 中转A准备点
  dur: 3.402
  ease: inout
  do:
    robot_point:
      id: robot-main.area-7-ready
      motion: move_j
- label: 中转A收集器1号位·高位接近
  dur: 4.0
  ease: linear
  do:
    robot_point:
      id: staging-a.p46.high
      motion: move_l
- label: 夹爪张开
  dur: 0.4
  ease: inout
  do:
    linkage:
      id: rob_grip_vial
      to: 0.0
- label: 中转A收集器1号位·近接近
  dur: 4.0
  ease: linear
  do:
    robot_point:
      id: staging-a.p46.near
      motion: move_l
- label: 中转A收集器1号位
  dur: 0.968
  ease: linear
  do:
    robot_point:
      id: robot-main.area-7-1
      motion: move_l
- label: 夹爪夹持
  dur: 0.4
  ease: inout
  do:
    linkage:
      id: rob_grip_vial
      to: 0.817195
- label: 单件随爪
  dur: 0.0
  do:
    attach:
      id: INV_STAGING_A_ITEM_1
      parent: TOOL_MOUNT
- label: 中转A收集器1号位·近接近
  dur: 0.775
  ease: linear
  do:
    robot_point:
      id: staging-a.p46.near
      motion: move_l
- label: 中转A收集器1号位·高位接近
  dur: 3.067
  ease: linear
  do:
    robot_point:
      id: staging-a.p46.high
      motion: move_l
- label: 中转A准备点
  dur: 2.788
  ease: inout
  do:
    robot_point:
      id: robot-main.area-7-ready
      motion: move_j
- label: 原点 (Home)
  dur: 4.0
  ease: inout
  do:
    robot_point:
      id: robot-main.home
      motion: move_j
