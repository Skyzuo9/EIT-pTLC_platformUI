    col_extend: 0.0
    col_lift: 0.0
    col_press: 0.0
    smp_locator: 0.0
    rob_flip_suction: 0.0
  linkages:
    rob_grip_plate96: 0.0
    rob_grip_vial: 0.0
    col_clamp: 0.0
    dev_t1_cyl1: 1.0
    dev_t1_cyl2: 1.0
    dev_t1_cyl3: 1.0
    dev_t1_cyl4: 1.0
    dev_t2_cyl1: 1.0
    dev_t2_cyl2: 1.0
    dev_t2_cyl3: 1.0
    dev_t2_cyl4: 1.0
steps:
- label: 起手·装吸盘
  dur: 0.0
  do:
    tool:
      action: lock
      id: TOOL_SUCTION
      snap: true
- label: '人工确认: {''lit'': ''换刀后对刀确认: ① plate_surface_z_mm 已按当前刀更新(未更新则缓降检查高度会撞板!)
    ② 刮板夹具已人工放入一块板(任意板, 角位置由定位夹具保证)。确认继续?''}'
  dur: 0.35
  do:
    wait: {}
- label: photoscrape.locate_cylinder 夹紧/伸出
  dur: 0.5
  ease: inout
  do:
    actuator:
      id: ps_locator
      to: 1.0
- label: photoscrape.press_cylinder 夹紧/伸出
  dur: 0.5
  ease: inout
  do:
    actuator:
      id: ps_press
      to: 1.0
- label: '人工确认: {''binop'': ''+'', ''left'': {''lit'': ''对位检查 — ''}, ''right'': {''field'':
    {''var'': ''ro''}, ''name'': ''text''}}'
  dur: 0.35
  do:
    wait: {}
- label: 对位8Y·回零
  dur: 0.4
  ease: inout
  do:
    axis:
      id: axis_8y
      to_mm: 0.0
- label: photoscrape.press_cylinder 松开/缩回
  dur: 0.5
  ease: inout
  do:
    actuator:
      id: ps_press
      to: 0.0
- label: photoscrape.locate_cylinder 松开/缩回
  dur: 0.5
  ease: inout
  do:
    actuator:
      id: ps_locator
      to: 0.0
compiled:
  moveLTrajectories: {}
  staleJointPoints: []
  plateAnchorChecks: []
  dataOnlyMechanisms: []
