schema: ptlc.clip/v3
name: flow.photoscrape_tool_align
label: 刮板-对刀(对位检查)
description: '由 PointRegistry 与上位机 operation 编译; 禁止手工填写生产关节角。显式假设: 本段开始时已挂 1 号刀, 机械臂在
  P1 安全位。板的落点由编译期的取放基准点静态定出(见 clip_compiler.PLATE_POINT_SLOT), 以 plate 原语写进片段; 实时页则由
  PlateBinding 按调度器账本跟手, 两条链互不干涉。'
operation:
  name: photoscrape_tool_align
  inputs: {}
assumptions:
  vision:
    voff_rz:
      valid: true
      dx_mm: 0.0
      dy_mm: 0.0
      drz_deg: 0.0
      err: 0
    voff_xy:
      valid: true
      dx_mm: 0.0
      dy_mm: 0.0
      drz_deg: 0.0
      err: 0
flowNotes:
- 条件分支按“条件成立”那一支编排; 实机按现场反馈选
- while 循环只编一轮; 实机的轮数由运行期条件决定
source:
  operation: config/operation/03_photoscrape/photoscrape_tool_align.yaml
  referencePointHash: 4b62a7049b8df0c5e0e8d34920f8cb64695f6dafe73eb04960c3301f9991c673
  kinematicsCommit: 37730d08b08c74061ae10d4fa5565b4c4c914885
  calibrationVersion: cr5-ptlc-2026-08-01-rail-carriage-center
  railCalib:
    axis: axis_11y
    zeroOffsetMm: 500.0
    sign: -1
    rangeMm:
    - -54.9
    - 845.1
home:
  axis_mm:
    axis_11y: 500.0
    axis_9x: 335.0
    axis_10z: 0.0
  joints_deg:
  - -154.523621
  - -47.783794
  - 93.294029
  - 44.639656
  - -89.062752
  - 124.999908
  actuators:
    ps_rotate: 0.0
    ps_press: 0.0
