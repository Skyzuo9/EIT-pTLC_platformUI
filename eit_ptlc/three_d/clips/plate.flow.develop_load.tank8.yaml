steps:
- label: 起手·装吸盘
  dur: 0.0
  do:
    tool:
      action: lock
      id: TOOL_SUCTION
      snap: true
- label: 板(起手时已在机器人手上)
  at: 0
  dur: 0
  do:
    plate:
      id: plate
      carry: true
      from: tank:8
- label: 8号缸开盖
  dur: 1.2
  ease: inout
  do:
    linkage:
      id: dev_t2_cyl4
      to: 0.0
- label: 地轨到位5
  dur: 0.5
  ease: inout
  do:
    axis:
      id: axis_11y
      to_mm: 600.0
- label: 吸盘下翻(持板朝下)
  dur: 5.0
  ease: inout
  do:
    actuator:
      id: rob_flip_suction
      to: 0.0
- label: 展开缸准备点
  dur: 4.0
  ease: inout
  do:
    robot_point:
      id: robot-main.area-2-ready
      motion: move_j
