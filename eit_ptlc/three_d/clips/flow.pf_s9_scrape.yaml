schema: ptlc.clip/v3
name: flow.pf_s9_scrape
label: 7 拍照刮取
description: '由 PointRegistry 与上位机 operation 编译; 禁止手工填写生产关节角。显式假设: 本段开始时已挂 1 号刀, 机械臂在
  P1 安全位。板的落点由编译期的取放基准点静态定出(见 clip_compiler.PLATE_POINT_SLOT), 以 plate 原语写进片段; 实时页则由
  PlateBinding 按调度器账本跟手, 两条链互不干涉。'
operation:
  name: pf_s9_scrape
  inputs:
    sample_id: ''
    save_dir: ''
    before_path: ''
    mode: manual
assumptions:
  vision:
    voff_rz:
      valid: true
      dx_mm: 0.0
      dy_mm: 0.0
      drz_deg: 0.0
      err: 0
    voff_xy:
      valid: true
      dx_mm: 0.0
      dy_mm: 0.0
      drz_deg: 0.0
      err: 0
flowNotes:
- 条件分支按“条件成立”那一支编排; 实机按现场反馈选
- while 循环只编一轮; 实机的轮数由运行期条件决定
- 条件分支按“条件成立”那一支编排; 实机按现场反馈选
- for 循环只编第 1 轮(pz=未知); 实机跑完整轮数
- 'photoscrape.scrape 按演示标称条带表现: 板cm bbox (2.0, 8.0, 18.0, 10.0), 5 列(真机按步距 1.2mm
  ≈ 133 列); 逐刀展开 2 刀 × 每刀切深 0.5mm(总深 1mm), 末刀才露玻璃; 收集按条带中线一趟 −X 回扫 —— 真实刀路由 PLC SoftMotion
  按每次视觉 summary 插补, 真值用「实机对照」'
- '粉桶进粉按演示条带折算: 有效面积 480mm²(标称带 ×0.15, 对齐真机参考带 480mm²) × 总深 1mm × 松散系数 1.6 = 768mm³,
  逐刀累加; 真机粉量由视觉轮廓面积逐次给出'
- 条件分支按“条件成立”那一支编排; 实机按现场反馈选
