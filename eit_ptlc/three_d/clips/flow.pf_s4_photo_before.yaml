steps:
- label: 起手·装吸盘
  dur: 0.0
  do:
    tool:
      action: lock
      id: TOOL_SUCTION
      snap: true
- label: 板在位
  at: 0
  dur: 0
  do:
    plate:
      id: plate
      at: spot_seat
- label: 点样7Y·移到放板位
  dur: 1.12
  ease: inout
  do:
    axis:
      id: axis_7y
      to_mm: 56.0
- label: sampling.place_release 松开/缩回
  dur: 0.5
  ease: inout
  do:
    actuator:
      id: smp_locator
      to: 0.0
- label: 地轨到位1
  dur: 1.66
  ease: inout
  do:
    axis:
      id: axis_11y
      to_mm: 168.0
- label: 上样点样准备点
  dur: 3.84
  ease: inout
  do:
    robot_point:
      id: robot-main.area-3-ready
      motion: move_j
- label: 吸盘上翻(托板朝上)
  dur: 5.0
  ease: inout
  do:
    actuator:
      id: rob_flip_suction
      to: 1.0
- label: 点样取板·远接近
  dur: 4.0
  ease: linear
  do:
    robot_point:
      id: spotting.pick.approach_far
      motion: move_l
- label: 点样取板·近接近
  dur: 4.0
  ease: linear
  do:
    robot_point:
      id: spotting.pick.approach_near
      motion: move_l
- label: 点样放板位
  dur: 1.117
  ease: linear
  do:
    robot_point:
      id: robot-main.area-3-1
      motion: move_l
- label: 吸盘吸气·板跟手
  dur: 0.35
  do:
    plate:
      id: plate
      carry: true
      from: spot_seat
- label: 点样取板·近退离
  dur: 0.681
  ease: linear
  do:
    robot_point:
      id: spotting.pick.retreat_near
      motion: move_l
- label: 点样取板·远退离
  dur: 2.604
  ease: linear
  do:
    robot_point:
      id: spotting.pick.retreat_far
      motion: move_l
- label: 上样点样准备点
  dur: 0.844
  ease: inout
  do:
    robot_point:
      id: robot-main.area-3-ready
      motion: move_j
- label: 原点 (Home)
  dur: 4.0
  ease: inout
  do:
    robot_point:
      id: robot-main.home
      motion: move_j
- label: 遮光气缸·回上位
  dur: 0.5
  ease: inout
  do:
    actuator:
      id: ps_shade
      to: 0.0
- label: 拍照8Y·回放板位
  dur: 0.4
  ease: inout
  do:
    axis:
      id: axis_8y
      to_mm: 0.0
- label: 刮板台准备点
  dur: 1.509
  ease: inout
  do:
    robot_point:
      id: robot-main.area-9-ready
      motion: move_j
- label: 吸盘上翻(托板朝上)
  dur: 5.0
  ease: inout
  do:
    actuator:
      id: rob_flip_suction
      to: 1.0
- label: 刮板台准备点
  dur: 0.35
  ease: inout
  do:
    robot_point:
      id: robot-main.area-9-ready
      motion: move_j
- label: 刮板台放板·远接近
  dur: 4.0
  ease: linear
  do:
    robot_point:
      id: scrape.plate-put.approach_far
      motion: move_l
- label: 刮板台放板·近接近
  dur: 3.3
  ease: linear
  do:
    robot_point:
      id: scrape.plate-put.approach_near
      motion: move_l
- label: 刮板台取板位
  dur: 1.277
  ease: linear
  do:
    robot_point:
      id: robot-main.area-9-2
      motion: move_l
- label: 吸盘放气·板落位
  dur: 0.35
  do:
    plate:
      id: plate
      at: scrape_table
- label: 刮板台放板·近退离
  dur: 0.665
  ease: linear
  do:
    robot_point:
      id: scrape.plate-put.retreat_near
      motion: move_l
- label: 刮板台放板·远退离
  dur: 1.65
  ease: linear
  do:
    robot_point:
      id: scrape.plate-put.retreat_far
      motion: move_l
- label: 刮板台准备点
  dur: 1.87
  ease: inout
  do:
    robot_point:
      id: robot-main.area-9-ready
      motion: move_j
- label: 吸盘下翻(持板朝下)
  dur: 5.0
  ease: inout
  do:
    actuator:
      id: rob_flip_suction
      to: 0.0
- label: 原点 (Home)
  dur: 2.04
  ease: inout
  do:
    robot_point:
      id: robot-main.home
      motion: move_j
- label: photoscrape.locate_cylinder 夹紧/伸出
  dur: 0.5
  ease: inout
  do:
    actuator:
      id: ps_locator
      to: 1.0
- label: 拍照8Y·板送进暗箱
  dur: 3.5
  ease: inout
  do:
    axis:
      id: axis_8y
      to_mm: 420.0
- label: 遮光气缸·落下
  dur: 0.5
  ease: inout
  do:
    actuator:
      id: ps_shade
      to: 1.0
- label: 刮板台·相机曝光
  dur: 0.3
  do:
    wait: {}
- label: 遮光气缸·回上位
  dur: 0.5
  ease: inout
  do:
    actuator:
      id: ps_shade
      to: 0.0
- label: 拍照8Y·板退出暗箱
  dur: 3.5
  ease: inout
  do:
    axis:
      id: axis_8y
      to_mm: 0.0
