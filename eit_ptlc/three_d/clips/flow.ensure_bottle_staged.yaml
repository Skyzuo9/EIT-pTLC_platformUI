    voff_rz:
      valid: true
      dx_mm: 0.0
      dy_mm: 0.0
      drz_deg: 0.0
      err: 0
    voff_xy:
      valid: true
      dx_mm: 0.0
      dy_mm: 0.0
      drz_deg: 0.0
      err: 0
flowNotes:
- 'ensure_bottle_staged 的换板决策取显式假设 {''op'': ''SWAP'', ''rack_slot'': 1, ''old_rack_slot'':
  1, ''hole'': 1}(运行期由 material.plan_staging 给出)'
- 换刀已按 1 号刀 → 2 号刀编出实际轨迹
