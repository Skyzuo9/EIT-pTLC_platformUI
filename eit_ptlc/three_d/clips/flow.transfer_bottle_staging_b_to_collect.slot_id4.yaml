label: 转运-单瓶 中转B→收集工位 (上位机, 参 slot_id) · 货架库位4
description: '由 PointRegistry 与上位机 operation 编译; 禁止手工填写生产关节角。显式假设: 本段开始时已挂 3 号刀, 机械臂在
