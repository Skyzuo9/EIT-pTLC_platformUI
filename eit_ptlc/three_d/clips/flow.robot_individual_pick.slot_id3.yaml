  dur: 2.59
  ease: inout
  do:
    robot_point:
      id: robot-main.area-7-ready
      motion: move_j
- label: 原点 (Home)
  dur: 4.0
  ease: inout
  do:
    robot_point:
      id: robot-main.home
      motion: move_j
