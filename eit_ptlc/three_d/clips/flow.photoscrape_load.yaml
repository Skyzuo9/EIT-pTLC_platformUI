  - -47.783794
  - 93.294029
  - 44.639656
  - -89.062752
  - 124.999908
  actuators:
    ps_rotate: 0.0
    ps_press: 0.0
    ps_locator: 0.0
    ps_shade: 0.0
    col_extend: 0.0
    col_lift: 0.0
    col_press: 0.0
    smp_locator: 0.0
    rob_flip_suction: 0.0
