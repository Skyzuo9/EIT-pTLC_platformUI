    rob_grip_plate96: 0.0
    rob_grip_vial: 0.0
    col_clamp: 0.0
    dev_t1_cyl1: 1.0
    dev_t1_cyl2: 1.0
    dev_t1_cyl3: 1.0
    dev_t1_cyl4: 1.0
    dev_t2_cyl1: 1.0
    dev_t2_cyl2: 1.0
    dev_t2_cyl3: 1.0
