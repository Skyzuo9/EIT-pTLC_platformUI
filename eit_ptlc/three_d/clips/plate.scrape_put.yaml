schema: ptlc.clip/v3
name: plate.scrape_put
label: 放板到刮板台
description: '由 PointRegistry 与上位机 operation 编译; 禁止手工填写生产关节角。显式假设: 本段开始时已挂 1 号刀, 机械臂在
  P1 安全位。板的落点由编译期的取放基准点静态定出(见 clip_compiler.PLATE_POINT_SLOT), 以 plate 原语写进片段; 实时页则由
  PlateBinding 按调度器账本跟手, 两条链互不干涉。'
operation:
  name: robot_suction_put
  inputs:
    station_id: scrape
assumptions:
  vision:
    voff_rz:
      valid: true
      dx_mm: 0.0
      dy_mm: 0.0
      drz_deg: 0.0
      err: 0
    voff_xy:
      valid: true
      dx_mm: 0.0
      dy_mm: 0.0
      drz_deg: 0.0
      err: 0
source:
  operation: config/operation/06_robot/robot_suction_put.yaml
  referencePointHash: 4b62a7049b8df0c5e0e8d34920f8cb64695f6dafe73eb04960c3301f9991c673
  kinematicsCommit: 37730d08b08c74061ae10d4fa5565b4c4c914885
  calibrationVersion: cr5-ptlc-2026-08-01-rail-carriage-center
  railCalib:
    axis: axis_11y
    zeroOffsetMm: 500.0
    sign: -1
    rangeMm:
    - -54.9
    - 845.1
home:
  axis_mm:
    axis_11y: 500.0
    axis_9x: 335.0
    axis_10z: 0.0
    axis_8y: 0.0
  joints_deg:
  - -154.523621
  - -47.783794
  - 93.294029
  - 44.639656
  - -89.062752
  - 124.999908
  actuators:
    ps_rotate: 0.0
    ps_press: 0.0
    ps_locator: 0.0
    ps_shade: 0.0
    col_extend: 0.0
    col_lift: 0.0
    col_press: 0.0
    smp_locator: 0.0
    rob_flip_suction: 0.0
  linkages:
    rob_grip_plate96: 0.0
    rob_grip_vial: 0.0
    col_clamp: 0.0
    dev_t1_cyl1: 1.0
    dev_t1_cyl2: 1.0
    dev_t1_cyl3: 1.0
    dev_t1_cyl4: 1.0
    dev_t2_cyl1: 1.0
    dev_t2_cyl2: 1.0
    dev_t2_cyl3: 1.0
    dev_t2_cyl4: 1.0
steps:
- label: 起手·装吸盘
  dur: 0.0
  do:
    tool:
      action: lock
      id: TOOL_SUCTION
      snap: true
- label: 板(起手时已在机器人手上)
  at: 0
  dur: 0
  do:
    plate:
      id: plate
      carry: true
      from: scrape_table
- label: 地轨到位2
  dur: 1.66
  ease: inout
  do:
    axis:
      id: axis_11y
      to_mm: 168.0
- label: 刮板台准备点
  dur: 1.509
  ease: inout
  do:
    robot_point:
      id: robot-main.area-9-ready
      motion: move_j
- label: 吸盘上翻(托板朝上)
  dur: 5.0
  ease: inout
  do:
    actuator:
      id: rob_flip_suction
      to: 1.0
- label: 刮板台准备点
  dur: 0.35
  ease: inout
  do:
    robot_point:
      id: robot-main.area-9-ready
      motion: move_j
- label: 刮板台放板·远接近
  dur: 4.0
  ease: linear
  do:
    robot_point:
      id: scrape.plate-put.approach_far
      motion: move_l
- label: 刮板台放板·近接近
  dur: 3.3
  ease: linear
  do:
    robot_point:
      id: scrape.plate-put.approach_near
      motion: move_l
- label: 刮板台取板位
  dur: 1.277
  ease: linear
  do:
    robot_point:
      id: robot-main.area-9-2
      motion: move_l
- label: 吸盘放气·板落位
  dur: 0.35
  do:
    plate:
      id: plate
      at: scrape_table
- label: 刮板台放板·近退离
  dur: 0.665
  ease: linear
  do:
    robot_point:
      id: scrape.plate-put.retreat_near
      motion: move_l
- label: 刮板台放板·远退离
  dur: 1.65
  ease: linear
  do:
    robot_point:
      id: scrape.plate-put.retreat_far
      motion: move_l
- label: 刮板台准备点
  dur: 1.87
  ease: inout
  do:
    robot_point:
      id: robot-main.area-9-ready
      motion: move_j
- label: 吸盘下翻(持板朝下)
  dur: 5.0
  ease: inout
  do:
    actuator:
      id: rob_flip_suction
      to: 0.0
- label: 原点 (Home)
  dur: 2.04
  ease: inout
  do:
    robot_point:
      id: robot-main.home
      motion: move_j
