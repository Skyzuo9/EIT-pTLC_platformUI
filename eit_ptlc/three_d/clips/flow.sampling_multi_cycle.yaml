schema: ptlc.clip/v3
name: flow.sampling_multi_cycle
label: 上样-周期(多样品, 一次装板点多条带)
description: '由 PointRegistry 与上位机 operation 编译; 禁止手工填写生产关节角。显式假设: 本段开始时已挂 1 号刀, 机械臂在
  P1 安全位。板的落点由编译期的取放基准点静态定出(见 clip_compiler.PLATE_POINT_SLOT), 以 plate 原语写进片段; 实时页则由
  PlateBinding 按调度器账本跟手, 两条链互不干涉。'
operation:
  name: sampling_multi_cycle
  inputs:
    samples: []
assumptions:
  vision:
    voff_rz:
      valid: true
      dx_mm: 0.0
      dy_mm: 0.0
      drz_deg: 0.0
      err: 0
    voff_xy:
      valid: true
      dx_mm: 0.0
      dy_mm: 0.0
      drz_deg: 0.0
      err: 0
flowNotes:
- 条件分支按“条件成立”那一支编排; 实机按现场反馈选
- for 循环只编第 1 轮(item=未知); 实机跑完整轮数
- 条件分支按“条件成立”那一支编排; 实机按现场反馈选
