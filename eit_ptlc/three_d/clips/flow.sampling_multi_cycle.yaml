- 点样色带按 SPOT_BAND_CALIB 标称映射(板cm x 0.9~17.9, y 3.8±0.225); 端点毫米实读点表 spot_pose, 站位零点是演示标定常量(出处见该常量注释),
  真值用实机对照
- 点样扫线 170mm@5mm/s 真值约 34s, 片段按节拍钳到 6s(emit_axis max_s); 且真机每程后往返吹干、蛇形扫最多60程, 片段只演单程
- for 循环只编第 1 轮(round_idx=0); 实机跑完整轮数
- sampling.rinse_mix 实机 1×3 轮, 演示压到 1×2 轮(终点体积不变)
