      dx_mm: 0.0
      dy_mm: 0.0
      drz_deg: 0.0
      err: 0
flowNotes:
- 起手挂 3 号刀 —— 按流程首个 robot_tool_ensure(needed=3) 推断(flow_discovery.infer_initial_tool)
- '起手态 col_extend=1: collect_load.yaml: collect.extend(动作码22)在本脚本前一行'
