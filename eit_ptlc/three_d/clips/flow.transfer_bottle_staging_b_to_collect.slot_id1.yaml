schema: ptlc.clip/v3
name: flow.transfer_bottle_staging_b_to_collect.slot_id1
label: 转运-单瓶 中转B→收集工位 (上位机, 参 slot_id) · 货架库位1
description: '由 PointRegistry 与上位机 operation 编译; 禁止手工填写生产关节角。显式假设: 本段开始时已挂 3 号刀, 机械臂在
  P1 安全位。板的落点由编译期的取放基准点静态定出(见 clip_compiler.PLATE_POINT_SLOT), 以 plate 原语写进片段; 实时页则由
  PlateBinding 按调度器账本跟手, 两条链互不干涉。'
operation:
  name: transfer_bottle_staging_b_to_collect
  inputs:
    slot_id: 1
assumptions:
  vision:
    voff_rz:
      valid: true
      dx_mm: 0.0
