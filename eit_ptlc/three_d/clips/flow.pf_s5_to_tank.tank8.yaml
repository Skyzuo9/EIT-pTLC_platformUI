- label: 起手·装吸盘
  dur: 0.0
  do:
    tool:
      action: lock
      id: TOOL_SUCTION
      snap: true
- label: 板在位
  at: 0
  dur: 0
  do:
    plate:
      id: plate
      at: scrape_table
- label: 地轨到位2
  dur: 1.66
  ease: inout
  do:
    axis:
      id: axis_11y
      to_mm: 168.0
