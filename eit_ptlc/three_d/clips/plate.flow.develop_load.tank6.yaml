steps:
- label: 起手·装吸盘
  dur: 0.0
  do:
    tool:
      action: lock
      id: TOOL_SUCTION
      snap: true
- label: 板(起手时已在机器人手上)
  at: 0
  dur: 0
  do:
    plate:
      id: plate
      carry: true
      from: tank:6
- label: 6号缸开盖
  dur: 1.2
  ease: inout
  do:
    linkage:
      id: dev_t2_cyl2
      to: 0.0
- label: 地轨到位5
  dur: 0.5
  ease: inout
  do:
    axis:
      id: axis_11y
      to_mm: 600.0
- label: 吸盘下翻(持板朝下)
