    voff_rz:
      valid: true
      dx_mm: 0.0
      dy_mm: 0.0
      drz_deg: 0.0
      err: 0
    voff_xy:
      valid: true
      dx_mm: 0.0
      dy_mm: 0.0
      drz_deg: 0.0
      err: 0
flowNotes:
- 起手挂 3 号刀 —— 按流程首个 robot_tool_ensure(needed=3) 推断(flow_discovery.infer_initial_tool)
- 'ensure_collector_staged 的换板决策取显式假设 {''op'': ''SWAP'', ''rack_slot'': 1, ''old_rack_slot'':
  1, ''hole'': 1}(运行期由 material.plan_staging 给出)'
- 换刀已按 3 号刀 → 2 号刀编出实际轨迹
- 'ensure_bottle_staged 的换板决策取显式假设 {''op'': ''SWAP'', ''rack_slot'': 1, ''old_rack_slot'':
  1, ''hole'': 1}(运行期由 material.plan_staging 给出)'
- 换刀已按 2 号刀 → 3 号刀编出实际轨迹
