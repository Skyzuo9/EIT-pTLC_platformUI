steps:
- label: 起手·装96孔板夹爪
  dur: 0.0
  do:
    tool:
      action: lock
      id: TOOL_PLATE96
      snap: true
- label: INV_STAGING_A 显示
  at: 0
  dur: 0
  do:
    state:
      id: INV_STAGING_A
      value: true
- label: INV_STAGING_A_ITEM_1 显示
  at: 0
  dur: 0
  do:
    state:
      id: INV_STAGING_A_ITEM_1
      value: true
- label: INV_STAGING_A_ITEM_2 显示
  at: 0
  dur: 0
  do:
    state:
      id: INV_STAGING_A_ITEM_2
      value: true
- label: INV_STAGING_A_ITEM_3 显示
  at: 0
  dur: 0
  do:
    state:
      id: INV_STAGING_A_ITEM_3
      value: true
- label: INV_STAGING_A_ITEM_4 显示
  at: 0
  dur: 0
  do:
    state:
      id: INV_STAGING_A_ITEM_4
      value: true
- label: INV_STAGING_A_ITEM_5 显示
  at: 0
  dur: 0
  do:
    state:
      id: INV_STAGING_A_ITEM_5
      value: true
- label: INV_STAGING_A_ITEM_6 显示
  at: 0
  dur: 0
  do:
    state:
      id: INV_STAGING_A_ITEM_6
      value: true
- label: 地轨到位3
  dur: 0.75
  ease: inout
  do:
    axis:
      id: axis_11y
      to_mm: 350.0
- label: 上样点样准备点
  dur: 3.84
  ease: inout
  do:
    robot_point:
      id: robot-main.area-3-ready
      motion: move_j
- label: 收集器组取暂放位·远接近
  dur: 3.839
  ease: linear
  do:
    robot_point:
      id: collector-group-staging-pick.far
      motion: move_l
- label: 收集器组取暂放位·中接近
  dur: 2.05
  ease: linear
  do:
    robot_point:
      id: collector-group-staging-pick.mid
      motion: move_l
- label: 夹爪张开
  dur: 0.4
  ease: inout
  do:
    linkage:
      id: rob_grip_plate96
      to: 0.0
- label: 收集器组取暂放位·近接近
  dur: 0.35
  ease: linear
  do:
    robot_point:
      id: collector-group-staging-pick.near
      motion: move_l
- label: 收集器组取暂放位
  dur: 0.5
  ease: linear
  do:
    robot_point:
      id: robot-main.area-6-15
      motion: move_l
- label: 夹爪夹持
  dur: 0.4
  ease: inout
  do:
    linkage:
      id: rob_grip_plate96
      to: 0.288
- label: 整板随爪
  dur: 0.0
  do:
    attach:
      id: INV_STAGING_A
      parent: TOOL_MOUNT
- label: 收集器组取暂放位·近接近
  dur: 0.4
  ease: linear
  do:
    robot_point:
      id: collector-group-staging-pick.near
      motion: move_l
- label: 收集器组取暂放位·中接近
  dur: 0.35
  ease: linear
  do:
    robot_point:
      id: collector-group-staging-pick.mid
      motion: move_l
- label: 收集器组取暂放位·远接近
  dur: 1.538
  ease: linear
  do:
    robot_point:
      id: collector-group-staging-pick.far
      motion: move_l
- label: 上样点样准备点
  dur: 1.536
  ease: inout
  do:
    robot_point:
      id: robot-main.area-3-ready
      motion: move_j
- label: 原点 (Home)
  dur: 4.0
  ease: inout
  do:
    robot_point:
      id: robot-main.home
      motion: move_j
