schema: ptlc.clip/v3
name: flow.ptlc_full_v2
label: pTLC 全流程 v2
description: '由 PointRegistry 与上位机 operation 编译; 禁止手工填写生产关节角。显式假设: 本段开始时已挂 1 号刀, 机械臂在
  P1 安全位。板的落点由编译期的取放基准点静态定出(见 clip_compiler.PLATE_POINT_SLOT), 以 plate 原语写进片段; 实时页则由
  PlateBinding 按调度器账本跟手, 两条链互不干涉。'
operation:
  name: ptlc_full_v2
  inputs:
    sample_id: DEMO-001
    save_dir: var/photoscrape/demo
    before_path: ''
    collector_hole: 1
    bottle_hole: 1
assumptions:
  vision:
    voff_rz:
      valid: true
      dx_mm: 0.0
      dy_mm: 0.0
      drz_deg: 0.0
      err: 0
    voff_xy:
      valid: true
      dx_mm: 0.0
      dy_mm: 0.0
      drz_deg: 0.0
      err: 0
flowNotes:
- 点样色带按 SPOT_BAND_CALIB 标称映射(板cm x 0.9~17.9, y 3.8±0.225); 端点毫米实读点表 spot_pose, 站位零点是演示标定常量(出处见该常量注释),
  真值用实机对照
- 点样扫线 170mm@5mm/s 真值约 34s, 片段按节拍钳到 6s(emit_axis max_s); 且真机每程后往返吹干、蛇形扫最多60程, 片段只演单程
- for 循环只编第 1 轮(round_idx=0); 实机跑完整轮数
- sampling.rinse_mix 实机 1×3 轮, 演示压到 1×2 轮(终点体积不变)
- '液位等待按润湿前沿表现: 0→14.7cm(板cm, 假设值出处见 WET_FRONT_TARGET_CM)匀速 8s; 真机是液位闭环等待(hard_cap
  3600s), 前沿高度那时由液位百分比与时间共同决定, 真值用实机对照'
- 条件分支按“条件成立”那一支编排; 实机按现场反馈选
- 'ensure_collector_staged 的换板决策取显式假设 {''op'': ''SWAP'', ''rack_slot'': 1, ''old_rack_slot'':
  1, ''hole'': 1}(运行期由 material.plan_staging 给出)'
- 换刀已按 1 号刀 → 2 号刀编出实际轨迹
- 'ensure_bottle_staged 的换板决策取显式假设 {''op'': ''SWAP'', ''rack_slot'': 1, ''old_rack_slot'':
  1, ''hole'': 1}(运行期由 material.plan_staging 给出)'
- 换刀已按 2 号刀 → 3 号刀编出实际轨迹
- 条件分支按“条件成立”那一支编排; 实机按现场反馈选
- while 循环只编一轮; 实机的轮数由运行期条件决定
- 条件分支按“条件成立”那一支编排; 实机按现场反馈选
- for 循环只编第 1 轮(pz=未知); 实机跑完整轮数
- 'photoscrape.scrape 按演示标称条带表现: 板cm bbox (2.0, 8.0, 18.0, 10.0), 5 列(真机按步距 1.2mm
  ≈ 133 列); 逐刀展开 2 刀 × 每刀切深 0.5mm(总深 1mm), 末刀才露玻璃; 收集按条带中线一趟 −X 回扫 —— 真实刀路由 PLC SoftMotion
  按每次视觉 summary 插补, 真值用「实机对照」'
- '粉桶进粉按演示条带折算: 有效面积 480mm²(标称带 ×0.15, 对齐真机参考带 480mm²) × 总深 1mm × 松散系数 1.6 = 768mm³,
  逐刀累加; 真机粉量由视觉轮廓面积逐次给出'
- 条件分支按“条件成立”那一支编排; 实机按现场反馈选
- 换刀已按 3 号刀 → 1 号刀编出实际轨迹
