    robot_point:
      id: staging-a.p50.high
      motion: move_l
- label: 中转A准备点
  dur: 2.863
  ease: inout
  do:
    robot_point:
      id: robot-main.area-7-ready
      motion: move_j
- label: 原点 (Home)
  dur: 4.0
  ease: inout
  do:
    robot_point:
      id: robot-main.home
      motion: move_j
