      id: robot-main.area-7-5
      motion: move_l
- label: 夹爪夹持
  dur: 0.4
  ease: inout
  do:
    linkage:
      id: rob_grip_vial
      to: 0.817195
- label: 单件随爪
  dur: 0.0
  do:
    attach:
      id: INV_STAGING_A_ITEM_5
      parent: TOOL_MOUNT
- label: 中转A收集器5号位·近接近
