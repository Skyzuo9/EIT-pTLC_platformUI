  dur: 0
  do:
    state:
      id: INV_STAGING_A_ITEM_5
      value: true
- label: 地轨到位2
  dur: 1.66
  ease: inout
  do:
    axis:
      id: axis_11y
      to_mm: 168.0
- label: 中转A准备点
