  ease: inout
  do:
    linkage:
      id: rob_grip_vial
      to: 0.0
- label: 中转A收集器5号位·近接近
  dur: 4.0
  ease: linear
  do:
    robot_point:
      id: staging-a.p50.near
      motion: move_l
- label: 中转A收集器5号位
  dur: 0.86
  ease: linear
  do:
