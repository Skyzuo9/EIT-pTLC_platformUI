steps:
- label: 起手·装吸盘
  dur: 0.0
  do:
    tool:
      action: lock
      id: TOOL_SUCTION
      snap: true
- label: 遮光气缸·回上位
  dur: 0.5
  ease: inout
  do:
    actuator:
      id: ps_shade
      to: 0.0
- label: 拍照8Y·回放板位
  dur: 0.4
  ease: inout
  do:
    axis:
      id: axis_8y
      to_mm: 0.0
- label: 上样5Z·抬针回零
  dur: 0.4
  ease: inout
  do:
    axis:
      id: axis_5z
      to_mm: 0.0
- label: 上样4X·回零
  dur: 0.4
  ease: inout
  do:
    axis:
      id: axis_4x
      to_mm: 0.0
- label: 点样6X·回零
  dur: 0.4
  ease: inout
  do:
    axis:
      id: axis_6x
      to_mm: 0.0
- label: 点样7Y·回零
  dur: 0.4
  ease: inout
  do:
    axis:
      id: axis_7y
      to_mm: 0.0
- label: 1号缸开盖
  dur: 1.2
  ease: inout
  do:
    linkage:
      id: dev_t1_cyl1
      to: 0.0
- label: 下压气缸·回原点
  dur: 0.5
  ease: inout
  do:
    actuator:
      id: col_press
      to: 0.0
- label: 夹持气缸·松开
  dur: 0.5
  ease: inout
  do:
    linkage:
      id: col_clamp
      to: 0.0
- label: 升降气缸·回原点
  dur: 0.5
  ease: inout
  do:
    actuator:
      id: col_lift
      to: 0.0
- label: 伸缩气缸·回原点
  dur: 0.5
  ease: inout
  do:
    actuator:
      id: col_extend
      to: 0.0
- label: 瓶定位气缸·回原点
  dur: 0.5
  ease: inout
  do:
    actuator:
      id: col_bottle_locator
      to: 0.0
