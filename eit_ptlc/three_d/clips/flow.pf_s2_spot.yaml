- label: 起手·装吸盘
  dur: 0.0
  do:
    tool:
      action: lock
      id: TOOL_SUCTION
      snap: true
- label: 板在位(前置段已放入)
  at: 0
  dur: 0
  do:
    plate:
      id: plate
      at: spot_seat
- label: 上样5Z·抬针(建气隔断)
  dur: 0.4
  ease: inout
  do:
    axis:
      id: axis_5z
      to_mm: 0.0
- label: 上样4X/3Y·移到样品孔·4X
  dur: 2.3
  ease: inout
