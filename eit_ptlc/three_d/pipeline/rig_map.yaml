    axis: [ 0, 1, 0 ]
    # ⚠ 2026-08-06 订正: sign 由 +1 改回 −1, zero_offset 同步由 −48.5 改成 +48.5(幅值不动)。
    #
    # 方向有 PLC 源码的**铁证**, 不需要靠观感或拖拽判:
    #   · Sampling_L2/A50_absorb_吸收液体 step 0 与 40: `上样轴5Z轴DATE.fAbsTarget:=0` = **抬针**;
    #   · 同 POU step 10: `fAbsTarget := HMI_上样轴5Z轴.position[2]`(实读 46.5) = **下探吸样**;
    #   · PLC_Servo_伺服/伺服调用: 4X 的移动门禁 `上样轴5Z轴DATE.fActPos<3`, 注释"仅5Z**抬起**<3时放开4X"。
    #   ⇒ 控制侧 mm 越大越低。本轴模型轴向 [0,1,0] 朝上, 故 sign 必须是 −1。
    #
    # 原 +1 来自"2026-08-02 用户在动作界面实拖判定" —— 那条路已被 docs/CLAUDE.md 第 35 条判死
    # (动作页拖拽在近距/俯视下会整体翻向), 且第 35 条**点名 axis_3y 与 axis_5z**。
    # 2026-08-05 那轮清理改了 axis_4x / axis_3y 的注释, 唯独漏了本条, 现补上。
    #
    # zero_offset 的符号必须跟着翻(第 37 条: 改标定三元组里任何一个都要整段复核)。
    # 取 +48.5 后三个已知位置同时落在合理处(针尖 Blender Z; 10mL 板落板 74.5 / 孔底 78.20 / 顶面 118.50):
    #   mm=46.5(下探) → δ=+2.0  → 78.51, 孔底上方 0.31mm
    #   mm=45.0(升降, 真机现值) → δ=+3.5 → 80.01, 孔底上方 1.8mm
    #   mm=0 (抬起)   → δ=+48.5 → 125.01, 板顶上方 6.5mm(刚够横移)
    # 三个互不相干的位置同时成立, 是这组值正确的强佐证。**现场仍须按
    # docs/AXIS_ZERO_CALIBRATION.md 七步法复核后定稿** —— 幅值 48.5 是沿用原值, 未经实测。
    sign: -1
    zero_offset_mm: 48.5 # 幅值沿用原值, 只订正符号; 现场七步法复核后定稿
    # 轨道范围: 与 3Y 同为自制同步带轴, 行程由导轨条定 ——
    #   _LRM9RLX180-S10-H-D-1 实测净长 180.0, 滑块(PTLC-05-011 导轨连接板所贴的
    #   _LRM9BK 块)长 31.0 ⇒ 行程 149。滑块现停在 Y(向上)[181.01, 212.01]、导轨
    #   [158.5, 338.5] ⇒ δ ∈ [-22.5, +126.5]。
    # ⚠ 旧注释在这里写过一句"取 −1 则上界只剩 22.5, 覆盖不了 50, 故反证 sign=+1 是对的" ——
    # 那是第 37 条的典型陷阱: 它**把 zero_offset 按住不动只翻 sign**。两个一起翻之后,
    # mm = zero − δ ⇒ mm ∈ [48.5−126.5, 48.5+22.5] = [−78.0, 71.0], 整段包住控制侧
    # limits [−5, 50](下留 73、上留 21)。旧值 [-5, 200] 跨度 205 是导轨行程的 1.4 倍。
    stroke_mm: 149
    range_mm:
      - -22.5
      - 126.5
    telemetry: { node: plc.sampling, key: Sampling_5Z_ActPos }
    rigged: true
    assigned_by: workbench-assign

