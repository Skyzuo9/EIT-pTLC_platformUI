  - id: axis_4x
    station: SAMPLING
    label: 上样轴4X
    # ⚠ 2026-08-05 身份订正: 本条目此前叫 `axis_3y`, 与下面那条(CFC30B 带物料盘)**认反了**。
    # 三条互不相干的证据:
    #   1. **方向惯例**: 全机 X 族轴(6X/9X)长轴恒为 glTF Z、Y 族(7Y/8Y/11Y)恒为 glTF X。
    #      十一根轴里只有本轴与下条违例, 且恰好互为对方 —— 见 verify_axis_travel.GEOMETRY
    #      的 Blender 轴索引列(本轴索引 1 = X 族, 物料盘那根索引 0 = Y 族)。
    #   2. **动作时序**(config/actions/01_sampling/plc_sampling.yaml, A20 `sampling.clean`):
    #      "先把5Z升到0, 再把**4X**移到 Sampling_4X_WashTarget、6X移到清洗位并下降5Z"
    #      —— 把针送去清洗池只动 4X + 5Z, 全程不动 3Y。只有 5Z 骑在**本轴**上这条时序
    #      才成立。A10 init 同样是"先 5Z 再 4X/6X/7Y", 且明写"只把3Y目标写为0,
    #      **并未命令3Y移动**"。按订正前的绑定, PLC 报 Sampling_4X_ActPos 时三维挪的是
    #      物料盘而针纹丝不动, 且两轴幅度都不越界所以从不报错。
    #   3. **几何**: 针管清洗池 `PTLC-05-028` 在 Blender y=+28.9, 针尖 `针-2` 在 y=-127.95,
    #      相距 +156.85 —— 正落在本轴 +Y 向 186.85 的可动窗口内(见下); 而物料盘那根轴
    #      沿 Blender X 走, 根本够不着清洗池。
    # 自制同步带轴(抽液机构总装-1 内): _LRM9RLX350 导轨 + 42CM08-1 步进 + 同步带-1.
    # 滑车 = 本轴滑块及其连接板/皮带压板/遮光板 + 整个 5Z 升降模组的定子(5Z 骑在
    # 本轴滑块上; 5Z 自己的滑车经 parent_axis 嵌套, 见 axis_5z 条目).
    # 归属依据 work/previews/axis_pilot_{overview,3y_jog}.png, 用户 2026-08-01 确认;
    # 存疑件(05-034 光电遮光板)按确认结论纳入, 重建后用 /3d/calib 面板 jog 复核.
    carriage_groups: []
    carriage_members:
      - { equals: "_LRM9BK-N-H-A_1-1", expect_count: 1 } # 本轴导轨滑块
      - { equals: "PTLC-05-008 导轨连接板-1", expect_count: 1 }
      - { equals: "PTLC-05-009 同步带连接板-1", expect_count: 1 }
      - { equals: "ECY51-S3M-150-1", expect_count: 1 } # 皮带压板(随滑车)
      - { equals: "PTLC-05-034 光电遮光板-1", expect_count: 1 }
      # ---- 以下为 5Z 模组定子, 整体骑在本轴滑块上 ----
      - { equals: "PTLC-05-010 注液模组安装板-1", expect_count: 1 }
      - { equals: "_LRM9RLX180-S10-H-D-1", expect_count: 1 } # 5Z 竖直导轨条
      - { equals: "同步带1-1", expect_count: 1 }
      - { equals: "42CM08-2", expect_count: 1 } # 5Z 步进电机
      - { equals: "EVD21-25-S3M150-2", expect_count: 1 } # 5Z 张紧轮
      - { equals: "PTLC-05-029 惰轮轴-3", expect_count: 1 }
      - { equals: "ADG01-609-L150-1", expect_count: 1 } # 5Z 侧感应杆
      # ---- 2026-08-05 补绑: 用户报"4X 至少少绑 4 个零件", 逐顶点审计出的定子侧遗漏 ----
      # 复现图 work/previews/audit_mod_{base,jog}_iso.png(候选件染橙): jog 后它们浮在原地。
      # 5Z 驱动带轮: 套在 42CM08-2 电机轴上(与电机三轴全重叠), 又咬着 5Z 皮带 同步带1-1。
      # 同型的 `-1` 在 y=+91.9(3Y 轨末端)是本轴自己的驱动轮, 属静止侧, 别一起收。
      - { equals: "EBF41-S3M150-25-B-P-d5-2", expect_count: 1 }
      # 5Z 上下限位光电: 卡在 ADG01-609-L150 感应杆上(y 向贴合 0.00mm), 遮光板
      # PTLC-05-033 在 5Z 滑车上从槽里穿过 —— 传感器属定子侧。
      # ⚠ 同型的 -1/-2/-3/-4 已在 prune_list.explicit_delete 里删掉, 只剩 -5 可绑。
      - { equals: "ZJF45-SX672-N-5-5", expect_count: 1 }
      # 扶针器: 顶面 z=158.50 与"注液模组安装板"底面 z=158.50 **贴合 0.00mm**, x/y 全重叠;
      # 而它离每一个 5Z 滑车成员都有 22.5~53.5mm 空隙, 一个都不挨。针从它的孔里穿过
      # (针 z 跨 76.5~201.0, 包住孔的 148.5~158.5)—— 正是"扶针"该有的滑配合。
      # ⚠ 这推翻了 2026-08-01 记在 axis_5z 注释里的"扶针器归 5Z"(那条只写了注释、从未
      #   写成规则, 所以一直没生效)。2026-08-05 用户按实测复核后改判归本轴。
      - { equals: "PTLC-05-015 扶针器-1", expect_count: 1 }
    axis:
      - 0
      - 0
      - 1
    # ⚠ 2026-08-05: 原注释写"2026-08-02 用户在动作界面实拖判定与真机反向, 由 +1 取反"——
    # 该判定作废。动作页的拖拽在**近距相机 + 俯视**下会整体翻向(实测俯视 12° 时 22.2/4.23/
    # 1.0/0.5 m 给 +20mm, 0.3/0.222 m 变 −27.1/−26.1mm; 病根见 AxisDragController 顶部注释),
    # 靠它定出来的 sign 不可信。本轮不臆断方向, 保留 +1 作**占位**, 一律以现场七步法第 2 步
    # (实机向正方向 jog 看虚拟动向)为准。回归测已锁: web/tests/three-d/axisDrag.test.js。
    sign: 1
    # ⚠ 2026-08-06 定案: 本轴"控制侧 1mm = 物理 2mm", 故加增益 scale_mm。
    # 换算全式: δ物理 = (mm − zero_offset_mm) × sign × scale_mm。
    #
    # 证据链(四条互不相干, 最后一条是现场卡尺):
    #   · 标定行距 9.0 → SBS 孔距 18.00                        = 2.00
    #   · 标定两盘位间距 55.5 → CAD 实测巢心距 112.0            = 2.02
    #   · 48 孔最小二乘(标定 vs CAD 孔位)                      = 2.016(残差 0.274mm)
    #   · **现场实测: 轴读 11.28mm, 卡尺量得实走 ≈22.6mm**      = 2.004
    # PLC 侧两点法实读 Δdi/Δf = 933.33 增量/mm, 而各伺服轴是 838,860 / 1,677,722
    # (2²³/导程, 与 L5/L10 型号逐项吻合)—— 本轴粗约 1800 倍, 因为它**不是 SV660N 伺服**
    # (整机 8 台驱动器却有 11 根轴), 是「自制同步带轴 + 42CM08 步进」, 标度另配且配错了。
    #
    # 推论(重要): 在 2× 口径下控制侧数字**逐项对上物理几何** —— 所以
    # config/calibration.yaml、HMI 示教表、PLC 代码**全都没错**, 它们是在真机上按真机的
    # 单位教出来的; 错的只是这根轴的标度。此前几轮"标定值可疑"的说法已撤销。
    #
    # ⚠⚠ **这是临时补偿, 不是终态**: 4X 与 5Z 后续都要由步进换成伺服, 届时标度重配,
    #    本字段必须改回 1.0 并重走标定。退役清单见
    #    docs/上样4X_5Z临时标度增益_换伺服后作废_20260806.md —— **别把它当成永久标定**。
    scale_mm: 2.0
    # 2026-08-06 在 scale_mm=2.0 下按 48 孔重解(最小二乘, 最大残差 0.501mm)。
    # 残差是均匀的 0.5mm: 标定表里两盘位间距 55.5 若按精确 2× 应为 56.0, 自身差 1.0mm,
    # 最小二乘把它在两块板之间平分了。
    #
    # ⚠ 原值 156.85 是**与本条目自己的注释矛盾**的: 那段注释推导出 zero = 79.85, 并且
    # 明写"差值只写注释, **不写进 zero_offset**", 而 156.85 恰恰就是那个"未解释的差"。
    # 属 CLAUDE.md 第 37 条同一家族(axis_5z 刚栽过一次)。顺带: 那处"清洗池离针 156.85mm
    # 而限位跨度只有 115mm、走不到清洗位"之谜, 在 2× 口径下自动消解 —— 156.85 物理
    # = 78.4 控制 mm, 稳稳落在 [-5, 110] 内。
    zero_offset_mm: 77.68
    # 轨道范围: 自制同步带轴, 无模组型号, 行程由导轨条定 ——
    #   _LRM9RLX350-S15-H-D-1 实测净长 350.0(型号数字即毫米长度, 0.0 误差),
    #   滑块 _LRM9BK-N-H-A_1-1 长 31.0 ⇒ 行程 350 − 31 = 319(裸导轨无端块, 取满)。
    #   滑块现停在 glTF z[82.95, 113.95]、导轨 z[-103.9, 246.1] ⇒ δ ∈ [-186.85, +132.15]。
    # ⚠ stroke_mm 与 δ 都是**物理 mm**, 而 range_mm 是**控制侧 mm** —— 两者差一个 scale_mm。
    #   控制侧窗口 = zero + δ/scale = 77.68 + [-93.4, +66.1] = [-15.75, 143.75],
    #   整段包住控制侧 limits [-5, 110](下留 10.8、上留 33.8)。
    #   gen_twin_manifest.check_axis_limits 也按同一口径乘回增益后再比。
    stroke_mm: 319
    range_mm:
      - -15.75
      - 143.75
    telemetry: { node: plc.sampling, key: Sampling_4X_ActPos }
    rigged: true

  - id: axis_3y
    station: SAMPLING
    label: 打样瓶上料轴3Y
    # ⚠ 2026-08-05 身份订正: 本条目此前叫 `axis_4x`, 与上面那条(同步带轴带 5Z/上样针)
    # **认反了**, 判据见上条顶部三条证据。名字语义也自洽: 「打样瓶上料轴3Y」运的正是
    # 装打样瓶的**物料盘**, 而「上样轴4X」带的是上样针。
    # 本轴 = CFC30B-1H03-S300 皮带模组带着的**物料盘**(台面高度 y≈74)。
    # 这一组正是 2026-08-03 从 axis_7y 摘下来后无人认领的那两件 —— 当时 axis_6x 的注释
    # 猜它是 6X 的滑车, **猜反了**(6X 在 480mm 之上的点胶头, 见 axis_6x 条目)。
    # 归本轴的证据:
    #   1. 贴合: 皮带滑块顶板 181.2.1.5 顶面 y=69.0 = 物料盘底面 y=69.0, 差 0.00mm;
    #   2. 针扎进盘: 5Z 滑车上的 `针-2` 下端 y=76.5 落在盘的板厚 y[69,79] 之内 ——
    #      针就是往盘里的瓶子扎, 盘必须能在针下面换列;
    #   3. 三轴正交: 4X 长轴 = glTF Z, 5Z = glTF Y(骑 4X 上), 本轴模组长轴 = glTF X,
    #      补齐第三个方向, 与 sampling.aspirate 用 3Y/4X/5Z + 孔板 吻合。
    #   4. 方向惯例(2026-08-05 补): 本轴沿 glTF X, 与 7Y/8Y/11Y 这些 Y 族轴同向 ——
    #      订正前它叫 4X, 是全机唯一一个"X 名字走 Y 族方向"的轴。
    carriage_groups: []
    carriage_members:
      - equals: PTLC-05-030 物料盘-1
        expect_count: 1
      # 气动接头 ×4: 两两一组分居板厚上下(y[64.9,68.2] 与 y[72.4,75.7]), 后者**嵌在**
