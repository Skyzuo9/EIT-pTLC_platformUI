    sign: 1
    # ⚠ 2026-08-06 由**实测**取代原先的居中占位: 41.1 → 20.70。
    # 依据: 拿 config/calibration.yaml 的 48 个孔目标与 CAD 实测孔心做最小二乘,
    # 本轴增益解得 **1.0000(残差 0.000mm)** —— 3Y 是干净的 1:1, 与 4X 的 2× 无关;
    # 零点解得 **20.70**。这比"几何窗口居中"强得多: 后者只保证不撞导轨, 不保证对准孔。
    #
    # 被取代的旧推导(留档以免有人照着改回去):
    #   δ ∈ [-78.6, +221.4] 且 mm = zero + δ 要含控制侧 [-20, 245]
    #   ⇒ zero ∈ [23.6, 58.6] ⇒ 取中点 41.1。
    #
    # ⚠ **已知张力**: 20.70 低于上式下界 23.6 约 2.9mm, 即 3Y 若被命令到极端的 245,
    # 模型滑车会冲出导轨 2.9mm(见下 range_mm)。取 20.70 是权衡后的选择 ——
    # 245 已超过示教的上料位 200(HMI 实读 position[7]=200.0), 几乎不用;
    # 而孔位是每次演示都要看的。**若 check_axis_limits 因此报警, 那条警告是对的, 别压掉。**
    zero_offset_mm: 20.70
    # 轨道范围 = CFC30B-1H03-S300 的 300 行程, 由几何直接定位(不必猜):
    #   导轨 181.1.1.1/.2 在 X 上跨 [822.42, 1238.42](长 416), 滑块 181.2.1.5 停在
    #   x[906.04, 1012.04](长 106) ⇒ 端块 (416−106−300)/2 = 5.0/端(与同族 9X 的
    #   CFC30B-S400 逐项一致), 可动窗口 δ ∈ [-78.6, +221.4]。
    # 2026-08-06 随 zero 20.70 重算: mm = zero + δ ⇒ [-57.90, 242.10](本轴 scale=1.0)。
    # ⚠ 上界 242.10 比控制侧 limits 的 245 少 **2.9mm** —— 这是上面那处已知张力的落点,
    #   不是笔误。命令到 245 时模型滑车会越界 2.9mm; 真机侧不受影响(三维不下发)。
    stroke_mm: 300
    range_mm: [ -57.90, 242.10 ]
    telemetry: { node: plc.sampling, key: Sampling_3Y_ActPos }
    rigged: true

