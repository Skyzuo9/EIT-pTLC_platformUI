      # 判据同 axis_7y 那段(贴合 / 形状族不重复 / 高度带), 三条一致才收:
      #   顶板 82.1.5.1.5 顶面 y=80.0 = 承载板 06-002 底面 y=80.0, 且它在 CAD 里本就
      #   自成子装配(82.1.5 → 82.1.5.1) —— 供应商把滑车建成了独立节点;
      #   82.1.15/16/28/29(y[69.3,74.7] 落在块带 y[69,80] 内, x 600.4/606.4 排成 2×2)
      #   与 82.1.22/26(钢带压块, x=603.4)两族在整根模组里只出现在滑车 X 上。
      # 反例(别收): 52.5mm 的 82.1.2/3/18/27/1/9 分布在 X=577.2/629.7/1147.6 三处、
      # y[49.3,65.7] 落在导轨侧槽带 —— 那是三只感应开关, 属定子。
      - equals: Open CASCADE STEP translator 7.6 82.1.5.1.5-1 # 滑块顶板 116×11×52.5
        expect_count: 1
      - equals: Open CASCADE STEP translator 7.6 82.1.15-1 # 块四角 ×4
        expect_count: 1
      - equals: Open CASCADE STEP translator 7.6 82.1.16-1
        expect_count: 1
      - equals: Open CASCADE STEP translator 7.6 82.1.28-1
        expect_count: 1
      - equals: Open CASCADE STEP translator 7.6 82.1.29-1
        expect_count: 1
      - equals: Open CASCADE STEP translator 7.6 82.1.22-1 # 钢带压块(+z)
        expect_count: 1
      - equals: Open CASCADE STEP translator 7.6 82.1.26-1 # 钢带压块(-z)
        expect_count: 1
      # 不收 82.1.5.1.1~.4(1.6~6.0mm 黄油嘴/堵头): 落在 prune_list 的
      # min_dimension_mm: 6.0 之下已被删, 写 expect_count 会让 03 步硬失败。

  - id: axis_9x
    station: PHOTOSCRAPE
    label: 刮板轴9X
    carriage_groups: []
    axis: [ 0, 0, 1 ] # Blender +Y → glTF −Z (_to_gl = (x, z, −y), 见 blender_clean.py:1377)
    sign: -1 # 故 mm 增大(Blender +Y, 收集器侧)= axis 反向
    zero_offset_mm: -48.67 # 由板原点角 plate_origin_x=93.234 解出(刀尖落板近边 Y=303.8)
    # 轨道范围: 跨度仍是 CFC30B-S400 的 400 行程, 但按几何把窗口订正到位(旧 [-60, 340]
    # 整体偏了 11.3 mm, 即让刀头能越过导轨下端 11.3 mm、上端反而少走 11.3 mm)。
    # 实测: 导轨 178.1.1.1/.2 在 Y 上跨 [107.9, 623.9](长 516), 滑块 178.2.1.5 停在
    # y[112.9, 218.9](长 106) ⇒ 端块 (516−106−400)/2 = 5.0/端(与同族 4X 一致), 且下端
    # 余量正好 5.0 = 端块厚 ⇒ CAD 位恰在行程端点, 故 mm 窗口 = [zero, zero+400]。
    # 仍含 板 93.2~291.0 与 PLC 硬编码停放位 335(拍照刮板.xml: 刮板轴9XDATE.fAbsTarget:=335)。
    stroke_mm: 400
    range_mm: [ -48.67, 351.33 ]
    telemetry: { node: plc.photoscrape, key: PhotoScrape_9X_ActPos }
    rigged: true
    # 刀具侧整摞骑在 CFC30B-1H03-S400 上(体 y 75.9..724.5, 行程 400, 长轴 = Blender Y)。
    # 滑车判据(raw.glb 实测): 模组内 10 个 OCC 实体里只有 `178.2-1`(y 112.9..218.9,
    # 顶面 z=351.0)是滑块 —— 06-006 模组连接板底面正好 z=351.0 贴在它上面, y 跨度也对齐;
    # `178.1-1`(y 107.9..623.9 长导轨)、两端块 178.7/178.4、电机 178.5/178.6、中段盖板
    # 178.3 都是定子; 178.8/178.9/178.10 三只同形同尺寸(49mm)块分布在 y≈157/523/563,
    # 是侧槽感应开关(与 CFG5 那三只同一反例族), 属定子。
    # 刀头链: 06-006(平板, 卧在滑块上) → 06-007(立板, -X 端垂下, CFG4 模组以 +X 面 806.9
    # 贴在它上面) → CFG4-L5-50 整模组; 05-025 点胶支撑板 ×2 立在 06-006 顶面 z=361;
    # _LRM12BK-N-H-A-3 是骑 _LRM12RLX520 辅助光轴的直线轴承(**必须带 -3**, -1/-2 是遮光门的)。
    carriage_members:
      - equals: PTLC-06-006 模组连接板1-1
        expect_count: 1
      - equals: PTLC-06-007 刮板模组安装板-3
        expect_count: 1
      - equals: PTLC-05-025 点胶支撑板-1.001
        expect_count: 1
      - equals: PTLC-05-025 点胶支撑板-2.001
        expect_count: 1
      # 不收 `PTLC-06-020 刮板拖链安装板-1`: prune_list 的 `tuo_lian`(拖链) 规则连它一起删了
      # (规则本意是删拖链内节, 波及了安装板), full 阶段命中 0 会硬失败。
      - equals: _LRM12BK-N-H-A-3
        expect_count: 1
      - equals: CFG4-L5-50-BC-T100W-C4_3D模型-1 # 10Z 模组本体(子轴的定子)
        expect_count: 1
      - equals: Open CASCADE STEP translator 7.6 178.2-1 # CFC30B 自身的滑块块
        expect_count: 1
      # ---- 2026-08-06: 收集器/翻料整摞由 axis_10z 迁来(用户目检"它不随 Z 升降") ----
      # 判据三条写在 ps_rotate 头注释里(面贴面 0.00mm / 桶底离板 6.9mm / 让位靠 9X)。
      # 06-011 贴 06-007 的 −X 面(806.92), 与 CFG4 模组同挂一块立板 —— 这才是它的真实父级。
      # 下面 10 条 = 原 axis_10z.carriage_members 里除 `钻头夹具支架装配-1` 外的全部。
      # 其中 06-012/013/014、05-041、HLH、硅胶收集、03-035、06-028 随后会被 ps_rotate /
      # ps_press 收进执行器组(它们声明了 parent_axis: axis_9x / parent_node), 净效果不变。
      - equals: PTLC-06-011 硅胶收集器安装板-1
        expect_count: 1
      - equals: HRQ7_DMSH-2_-1
        expect_count: 1
      - equals: PTLC-06-012 旋转气缸连接板-1
        expect_count: 1
      - equals: PTLC-06-013 压紧安装块-1
        expect_count: 1
      - equals: PTLC-05-041 插紧气缸安装板-1
        expect_count: 1
      - equals: HLH6X20S_0_+_DMSH-2_-1
        expect_count: 1
      - equals: 硅胶收集-1.008
        expect_count: 1
      - equals: PTLC-06-014 接头安装块-2
        expect_count: 1
      - equals: PTLC-03-035 导向块-2
        expect_count: 1
      - equals: PTLC-06-028 穿板鲁尔接头-1
        expect_count: 1

  - id: axis_10z
    station: PHOTOSCRAPE
    label: 刮板轴10Z
    parent_axis: axis_9x # 10Z 模组整个骑在 9X 滑车上(照 axis_5z 骑 axis_3y 的写法)
    carriage_groups: []
    axis: [ 0, 1, 0 ]
    sign: -1 # 上位机约定 Z+ 为向下
    # 由 gcode.plate_surface_z_mm=20.5 反解: 10Z=20.5 时刀尖落玻璃面 Blender z=251.5。
    # ⚠ 这个数与 spindles.ps_spindle.protrusion_mm **强耦合**: zero_offset_mm = protrusion_mm − 14
    # (主轴鼻端实测 z=286, 玻璃面 z=251.5, 位移 = mm − zero_offset)。2026-08-06 之前数模里
    # 根本没有那段刀刃, 本行却已按"刀伸出 10mm"算好 —— 现在几何补上了, 两者对齐。
    zero_offset_mm: -4.0
    # 轨道范围: 跨度仍是 CFG4-L5-50 的 50 行程(旧 [0,200] 远超模组本身, 上一轮已收),
    # 本轮按几何把窗口平移 14 mm 到位 —— 旧 [0, 50] **不含 CAD 位 -14**, 意味着模型永远
    # 回不到加载态, 且 mm=0 时刀头已下探了 14 mm。
    # 实测: 导轨 18.1.13/41/45/46 在 Y 上跨 [281.0, 471.0](长 190), 滑块 18.1.42 停在
    # y[356.0, 446.0](长 90) ⇒ 端块 (190−90−50)/2 = 25.0/端(与同族 6X/7Y 一致), 上端
    # 余量正好 25.0 ⇒ CAD 位恰在行程顶端, mm 窗口 = [zero, zero+50]。
    # 覆盖 gcode.plate_surface_z_mm=20.5(刀尖落玻璃面)与"抬起判据 <6"。
    stroke_mm: 50
    range_mm:
      - -14
      - 36
    telemetry: { node: plc.photoscrape, key: PhotoScrape_10Z_ActPos }
    rigged: true
    # 刀头一簇。判据: `钻头夹具支架装配-1` 内含 `PTLC-06-009 滑块连接板` +
    # `PTLC-06-010 滑块阻挡块-1/-2`(z 356..366 与 421..431, 净空 55mm ≈ 模组行程),
    # 命名与 8Y 托台的 `PTLC-06-002 滑块连接板` 同一套路 ⇒ 骑在 10Z 滑块上。
    #
    # ⚠ 2026-08-06 两处订正(用户目检):
    # (a) **收集器/翻料整摞已迁往 axis_9x** —— 旧注释"与刀同步升降才能保证吸粉口与板面距离
    #     恒定"是错的: 06-011 与 9X 滑车成员 06-007 面贴面 0.00mm, 结构上够不到 Z 滑块; 且粉桶
    #     底离板面只有 6.9mm, 随 Z 下探 25mm 会扎进板 18mm。判据全文见 ps_rotate 头注释。
    # (b) 旧注释"CFG4-L5-50 只有 2 个 OCC 实体, **拆不出模组滑块块**"也是错的 ——
    #     `CFG4-…模组-1` 的 `18.1-1` 是 EMPTY, 下挂 **50 个独立网格**, 滑块 `18.1.42` 就在里面
    #     (上面 range_mm 那段注释自己就认出过它)。于是滑车件一直留在 9X 定子里, 10Z 一动就与
    #     刀头脱节。下面按 8Y/9X 同一套判据把它们收进来。
    #
    # CFG4 滑车件判定(逐顶点实测, 滑块窗口 = 06-008 钻头安装板的 z[356.0, 446.0]):
    #   · 导轨件一律跨全程 z[281.0, 471.0](18.1.13/41/45/46), 与滑车件天然可分;
    #   · **滑车质心 z=401.0** —— 收下的每一件不是自身居中于 401, 就是成对跨 401 对称。
    #   收: 18.1.42(9×42.6×90, 形状族唯一, 长度=行程窗口, 06-008 贴其 −X 面 0.9mm) /
    #       18.1.39(12×40×50, 形状族唯一, 居中 401, x 754.9..766.9 同时压住滑块与安装板
    #               —— 用户说的"Z 轴后面那个连接块"就是它) /
    #       18.1.8+18.1.27(15×6.5×11 成对, 均居中 401, 关于刀轴 y=161.9 对称;
    #               与 8Y 已收的 CFG5 钢带压块 82.1.22/26 同族同形) /
    #       18.1.9+12 与 18.1.15+16(Ø7.2 螺钉四只, x 757.8..765.0 落在滑块体内,
    #               两两跨 401 ±3, y 贴滑块两端 —— 穿滑块的紧固螺钉)。
    #   **不收(必须写明, 不做静默截断)**:
    #   · 伸缩防尘罩 18.1.10/31(40mm)、18.1.11/40(52.5mm)在 **z=401 处一分为二**,
    #     对侧单件 18.1.14/24 —— 它们要伸缩不是平移, 收走任一半都会把这对撕开;
    #   · 上述罩子的端头螺钉 18.1.1/2/19/23(x=772.1,y=177.3)、18.1.47/51(x=772.1,y=146.5)、
    #     18.1.17/18/48/50/49/52(x=781.5) —— 逐只都能对上所属罩子的端面 z, 跟罩子走;
    #     其中 18.1.1/23/47/17/18/48/50 虽落在 [356,446] 窗口内, 归属仍是定子侧。
    #   · 钢带本体 18.1.45(0.1mm 薄片, 跨全程)—— 两端固定, 滑车从它下面过。
    # 注: 06-012~014 等转子件已随收集器整摞迁走, 本轴不再涉及 ps_rotate。
    carriage_members:
      - equals: 钻头夹具支架装配-1 # 整个子装配: 钻头/夹具/IAJ41 缓冲/06-008/06-009/06-010×2
        expect_count: 1
      - equals: Open CASCADE STEP translator 7.6 18.1.42-1 # CFG4 滑块体 9×42.6×90
        expect_count: 1
      - equals: Open CASCADE STEP translator 7.6 18.1.39-1 # 连接块 12×40×50
        expect_count: 1
      - equals: Open CASCADE STEP translator 7.6 18.1.8-1 # 钢带压块(+y)
        expect_count: 1
      - equals: Open CASCADE STEP translator 7.6 18.1.27-1 # 钢带压块(−y)
        expect_count: 1
      - equals: Open CASCADE STEP translator 7.6 18.1.9-1 # 滑块紧固螺钉 ×4
        expect_count: 1
      - equals: Open CASCADE STEP translator 7.6 18.1.12-1
        expect_count: 1
      - equals: Open CASCADE STEP translator 7.6 18.1.15-1
        expect_count: 1
      - equals: Open CASCADE STEP translator 7.6 18.1.16-1
        expect_count: 1

# ---------------------------------------------------------------------------
# 主轴(持续自转的切削刀具). 与 actuators 的 `motion: rotate` 是两回事:
#   · 执行器旋转是**有限角、绝对值写入**(0..1 → 0..180°), 值是时间的纯函数;
#   · 主轴是**无限角、按转速积分**, 相位不可能是 t 的纯函数。
# 因此本段只声明"开/关 + 转速", 相位由前端逐帧累加(与补光 setFlash 同属渲染层装饰,
# home() 时清零), 片段/实时链只驱动那个布尔 —— seek 幂等契约不破。
#
# 三个消费方:
#   1) blender_clean.build_spindle_cutters —— 按本段补出缺失的刀刃几何(见该函数 docstring);
#   2) gen_twin_manifest —— 透传成 manifest.spindles, 前端据此绑定节点;
#   3) clip_compiler / TwinBindings —— 按 trigger.action 决定何时置 on。
# ---------------------------------------------------------------------------
spindles:
  # 刮板铣刀主轴。PLC 里**没有**主轴的独立信号(manual_points.photoscrape 只有
  # ps_shade/rotate/press/vacuum/motor/locator 六个, 其中 ps_motor 按 A40 动作注释是
  # 吸粉无刷电机 %QX7.3 —— 是吸力源不是主轴, 拿它驱主轴会在"停吸不停刀"时显示反)。
  # 故触发源取 photoscrape.scrape(A40) 这条动作本身: 它在跑 = CNC 在切削 = 刀在转。
  - id: ps_spindle
    label: "刮板铣刀主轴"
    station: PHOTOSCRAPE
    node: TOOL_CUTTER_BIT
    parent: 钻头夹具支架装配-1 # 与 axis_10z 同一刚体, 随 Z 升降
    source_mesh: 钻头-3 # 鼻端位置由它逐顶点实测, 不写死坐标
    nose_radius_mm: 5.0 # 实测 Ø10 平口; 对不上即 CAD 换过主轴, 硬失败
    diameter_mm: 2.0 # = app.yaml gcode.tool.cutter_diameter_mm(刀补/步距都按它算)
    protrusion_mm: 10.0 # 见 build_spindle_cutters: zero_offset_mm = protrusion_mm − 14
    axis: [ 0, 1, 0 ] # glTF +Y(竖直), 与 axis_10z 同向
    rpm: 9000 # 演示转速。真机无转速反馈, 这是观感值 —— 屏幕上只需"看得出在转"
    trigger: { action: photoscrape.scrape }

# ---------------------------------------------------------------------------
# 机器人: DOBOT CR5, 6 个关节.
#
# 原始 CAD 机械臂本体不再参与枢轴/轴向推算。Blender 严格按固定提交的 xacro 建立
# ORIGIN -> ROTOR(local-Z) 六轴刚体链并导入官方连杆；这里只声明整机定位与自制末端件。
# ---------------------------------------------------------------------------
robot:
  pattern: "^DOBOT"
  joints_rigged: true
  telemetry: { node: robot, joint_key: joint, tool_key: tool_state.mounted_tool }
  # 固定提交的官方 xacro + 七个米制 STL。数值映射来自版本化标定文件。
  kinematics:
    repository: "https://github.com/Dobot-Arm/DOBOT_6Axis_ROS2_V4"
    commit: "37730d08b08c74061ae10d4fa5565b4c4c914885"
    xacro: "../vendor/dobot-cr5-37730d08-full/cra_description/urdf/cr5_robot.xacro"
    mesh_dir: "../vendor/dobot-cr5-37730d08-full/cra_description/meshes/cr5"
    calibration: "calibration/cr5_ptlc_v1.yaml"
  base_transform:
    translation_m: [ 0, 0, 0 ]
    rpy_deg: [ 0, 0, 0 ]
  # 仅保留 PTLC 自制末端结构；旧 CR5 CAD 本体会被官方连杆替换。
  custom_mount_members:
    - { contains: "PTLC-07-028" }
    - { contains: "QT2191876" }
  tool_mount: { node: "TOOL_MOUNT" }

# ---------------------------------------------------------------------------
# 可更换工具(工件系统): 这些子树**永不并入 STATIC 静态合并**, 各自保持为独立
# 可重挂节点 —— 换夹爪动画的 attach 语义(夹爪被法兰"带走")依赖它.
# ---------------------------------------------------------------------------
tools:
  - id: TOOL_PLATE96
    controller_tool: 2
    connector: { contains: "QT2091392" }
    root: { contains: "96孔板夹具总装" }
    label: "96孔板夹爪"
    # 从正式 robot.tool_pickup 在 2 号工具目标点执行 lock 后读取的
    # TOOL_MOUNT -> TOOL_PLATE96 局部刚体变换。实时 mounted_tool 恢复必须
    # 使用同一变换，不能退回单位四元数，否则大夹爪会绕安装轴错转约 90°。
    mount_transform:
      position_m: [ 0.000420864, -0.000465401, -0.000431585 ]
      quaternion_xyzw: [ -0.707592304, 0.000684711, 0.000743800, 0.706620202 ]
      source: "robot.tool_pickup/tool-2 lock pose"
  - id: TOOL_VIAL
    controller_tool: 3
    connector: { contains: "QT2091392" }
    root: { contains: "样品瓶夹具总装" }
    label: "样品瓶电爪"
    # 快换耦合是纯机械量：三个工具侧 QT2091392 在 CAD 工具站里共用同一坐标朝向
    # (calibration/cr5_ptlc_v1.yaml 的 dock_frame_rotation)，锁紧后
    # TOOL_MOUNT -> TOOL_* 的局部变换与槽位无关，因此三把刀共用 2 号刀标定出的那组值。
    # shared_coupling 让 blender_clean._check_dock_frames 把这个前提变成会失败的断言。
    # 缺这段时实时挂载会退回单位四元数，小夹爪绕安装轴错转约 90°（与大夹爪当年同因）。
    mount_transform:
      position_m: [ 0.000420864, -0.000465401, -0.000431585 ]
      quaternion_xyzw: [ -0.707592304, 0.000684711, 0.000743800, 0.706620202 ]
      shared_coupling: true
      source: "shared QT2091392 coupling (= robot.tool_pickup/tool-2 lock pose)"

  # 1 号玻璃吸盘。CAD 侧 `吸盘夹具支架/` 只有一个把工具与料架混在一起的
  # `玻璃夹具支架装配.SLDASM`，没有像另外两把刀那样拆成「XX夹具总装(工具) +
  # XX夹具支架总装(料架)」，所以 root 抓不到它 —— 这曾被误判成"CAD 缺少完整工具几何"，
  # 实际零件一直都在，只是散落在 `夹具总装-1` 下、还被静态合并吃掉了安装板。
  # 必须排在最后：members 只收"尚未被前序工具认领"的对象，靠这一点把三把刀共用的
  # QT2091392 零件号收敛到 slot-1 那一个实例。
  - id: TOOL_SUCTION
    controller_tool: 1
    connector: { contains: "QT2091392" }
    label: "玻璃吸盘"
    members:
      - { contains: "QT2091392" } # 工具侧快换(slot-1 实例)
      - { contains: "PTLC-07-008 快换安装板" }
      - { contains: "PTLC-07-006 快换安装板1" }
      - { contains: "PTLC-07-007 加强筋" } # 4 件
      - { contains: "PTLC-07-009 旋转气缸安装板" }
      - { contains: "HRQ10A+_DMSH-2_" } # 旋转气缸(工具号语义里的"旋转吸附")
      - { contains: "PTLC-07-010 电爪连接板" }
      - { contains: "SAB22-KQ2E06" } # 2 个真空吸盘
    # 不含料架侧：吸盘治具架支撑柱-1..4、PTLC-07-001/002/004(夹具固定板/定位板/治具支撑柱)，
    # 以及 PSL4M5A（M5-4厘）气路接头 —— slot-2/3 的同型接头当年也留在料架侧，按对称排除。
    mount_transform:
      position_m: [ 0.000420864, -0.000465401, -0.000431585 ]
      quaternion_xyzw: [ -0.707592304, 0.000684711, 0.000743800, 0.706620202 ]
      shared_coupling: true
      source: "shared QT2091392 coupling (= robot.tool_pickup/tool-2 lock pose)"

# ---------------------------------------------------------------------------
# 上样孔板: 样品液体的储存容器, 坐在「打样瓶上料轴3Y」的物料盘上
# ---------------------------------------------------------------------------
# 控制侧对这套东西**早就**建好了模型, 缺的只是三维里的板本身:
#   config/actions/01_sampling/plc_sampling.yaml 的 sampling.aspirate / rinse_mix 参数是
#     plate_spec(默认 "4×6" = 24 孔) + plate_no(1/2 两个盘位) + well(如 A1);
#   config/calibration.yaml 给两块 4×6 板各存了 3 点仿射标定;
#   controller/plate_affine.py 按 (col,row) → (4X, 3Y) mm 实时算孔位.
# 三维只负责把板画出来并摆对, **不参与孔位下发** —— 真机走的是标定, 不是这里的几何.
#
# 尺寸规格全在 pipeline/labware_geom.py 的 PLATE_SPECS —— 来源是**实际采购件的厂商技术
# 参数表**(A-GEN, 原件在仓库根的 `深孔板规格文件/`), 型号 P-10-SQV-24 / P-15-SQV-24。
# 本段只决定"装哪一种、装在哪块托盘上、验收放多松".
#
# ⚠ 两个规格**不是同一个外形只换高度**(2026-08-06 按厂商表订正; 此前照网上的通用 SBS 值
#   建模并写过"footprint 完全相同", 是错的):
#     10mL  127.50 × 85.50 × 44.00, 裙边 2.50, 孔深 41.90
#     15mL  127.20 × 85.30 × 63.20, 裙边 2.90, 孔深 60.30
#   孔距都是 18.00、方孔边长都是 17.10、孔底都是 Ø14.00(内)/Ø15.50(外)。
# 换规格 = 改下面 installed 一行 + 重跑 clean 链, 不必动几何代码.
#
# ⚠ 选 15mL 前先核净空, **这不是"紧", 是直接撞**:
#   15mL 板顶面在 z≈137.7, 而 5Z 抬到头(mm=0)针尖只到 z≈125.0 —— 针**低于板顶 12.7mm**,
#   横移必撞。10mL 板顶 118.5, 抬起位高出 6.5mm 才走得了。
#   另外板顶与 4X 滑车上的扶针器 `PTLC-05-015 扶针器-1`(底面 z=148.5, XY 有约 7mm 重叠)
#   也只剩 10.8mm(10mL 是 30.0mm)。两条 verify_sample_plates.py 都会算出来。
#
# ⚠ 读本段前先知道一件事: **上样 4X 的"控制侧 1mm" = "物理 2mm"**(2026-08-06 卡尺定案),
#   三维靠 `axes` 里 axis_4x 的 `scale_mm: 2.0` 补偿。所以本段涉及 4X 的任何 mm 数字,
#   都要先分清是控制侧还是物理。这是**临时措施**, 4X/5Z 换伺服后作废 ——
#   见 docs/上样4X_5Z临时标度增益_换伺服后作废_20260806.md。
sample_plates:
  enabled: true
  # 装哪一种(labware_geom.PLATE_SPECS 的键). 默认 10mL: 针的行程余量大, 且与
  # sampling.aspirate 的 sample_volume_ml 上限(12mL)相称.
  installed: deepwell_24_10ml
  # 载具: axis_3y 滑车上的物料盘. 巢的位置**全部实测**(见 blender_clean.measure_plate_nests),
  # 这里只给零件名 —— 声明了却匹配不到会硬失败, 不会静默跳过.
  tray: "PTLC-05-030 物料盘-1"
  nests: 2                    # 实测巢数必须恰好等于它, 对不上就硬失败并打印实测清单
  material: MAT_LABWARE_PP    # 配方在 material_semantics.yaml 的 functional_overrides
  # 板与巢的总间隙允许区间(mm). 本机实测开口 131.9 × 90.0, 对 127.76 × 85.48 的板
  # 是 4.2 / 4.5mm 总间隙 —— 标准的 SBS 巢配合. 超出区间即判为"认错了巢或规格选错了".
  clearance_mm: { min: 0.5, max: 8.0 }
  # 落板台肩的最小接触面积(cm²): 用来在若干候选高度层里选出真正的台肩.
  # 本机台面 79.0 之下依次是 78.0(1mm 窄沿, 面积不够)、74.5(四条 32×90 台肩, 命中)、
  # 70.99(深槽, 给孔底让位).
  min_seat_area_cm2: 40.0
  probe_step_mm: 2.0          # 高度图栅格; 2mm 对 132mm 的巢足够, 再密只是变慢
  # 盘位编号 —— **必须与控制侧的 plate_no 对齐**, 不许按坐标随手排。
  # 2026-08-06 事故: 原实现按 Blender (y,x) 升序自动编号, 与 config/calibration.yaml 的
  # plate_4x6_1 / plate_4x6_2 毫无关联, 结果编反了; 48 孔拟合一配对就露馅(残差 0.27 → 60.9mm)。
  # 推导(可复核): 控制侧 4X 的 mm 越大 → 沿 glTF +Z 走得越远 → Blender Y 越**负**。
  #   plate_no 1 的 4X 是 23.0~50.0(小) ⇒ 落在 Blender Y 较大(较不负, −45.1)那个巢;
  #   plate_no 2 的 4X 是 78.5~105.5(大) ⇒ 落在 Blender Y 更负(−157.1)那个巢。
  # ⇒ 按 Blender Y **降序**编号, slot 1 = Y=−45.1 那个。
  # 缺这一段会硬失败(不再提供隐式缺省), 就是为了逼后来人重新推一遍而不是照抄。
  slot_order:
    axis: y
    descending: true
  # 净空参考件: 03 步顺手量下它们的世界包围盒写进报告, 判据由 verify_sample_plates.py
  # 做纯算术 —— 测量与判断分开, 改判据不必重跑二十多分钟的管线.
  clearance_refs:
    needle: "针-2"                      # 上样针: 判"够得着孔底"与"抬得过板顶"
    guide: "PTLC-05-015 扶针器-1"       # 扶针器(骑 4X 定子侧): 判板顶与它的净空
