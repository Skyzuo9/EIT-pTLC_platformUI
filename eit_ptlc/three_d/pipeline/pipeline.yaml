# PTLC 三维可视化资产管线配置
# 功能: 集中管理所有绝对路径/转换公差/性能预算, 供 01~05 各步骤脚本读取.
# 说明: 本文件是管线的唯一配置入口; 换一台机器只需改这里.

paths:
  # 工具链
  python: "C:/ProgramData/miniforge3/python.exe"
  blender: "C:/Program Files/Blender Foundation/Blender 5.2/blender.exe"

  # 目录(全部位于 three_d 之下)
  root: ".."
  work: "../work"
  exports: "../exports"
  models: "../models"
  docs: "../docs"

  # 图纸源目录(只读, 绝不写入)
  cad_root: "E:/eit_lab/eit_lab_hardware/eit_ptlc_station"

sources:
  # 整机装配体 —— 一切的源头. 原生 glTF 导出直接吃它.
  full_assembly: "E:/eit_lab/eit_lab_hardware/eit_ptlc_station/TLC设备总装.SLDASM"

  # 首选源: SolidWorks 自带 XR 导出器直出的整机 GLB(00 步产物).
  # 相对 STEP 保住了真实装配实例名、中文名、具名 PBR 材质与自定义属性,
  # 还省掉 01(命名回填)与 02(OCCT 转换 11 分钟)两步.
  native_glb: "../exports/TLC_full_native.glb"

  # 回退源: 2026-02 导出的整机 STEP(AP203, 无颜色, 缺三个总成).
  # 原生导出走不通时才用它, 此时必须跑 01 与 02.
  legacy_full_step: "E:/eit_lab/eit_lab_hardware/eit_ptlc_station/TLC设备总装.STEP"
  fresh_full_step: "../exports/TLC_full_AP214.STEP"

# 模型来源开关: native_glb(首选) | step(回退)
# 03 步据此决定读哪个输入; 走 step 时才需要先跑 01/02.
model_source: "native_glb"

# ---------------------------------------------------------------------------
# 00_export_gltf: 空叶节点门禁
# ---------------------------------------------------------------------------
# XR 导出器对部分零件只留空节点不给几何(2026-08-02 上样 EBF41 同步带轮丢失一案).
# 导出后凡是白名单之外的空叶节点一律报错.
# 白名单按实例名整串匹配, 只放"确认有意隐藏/压缩"的; 分类确认后再往里填.
export_gate:
  expected_empty_nodes: []

# ---------------------------------------------------------------------------
# 03_clean_model: 空节点补几何
# ---------------------------------------------------------------------------
# 有些零件**装配导出**拿不到几何(整机 GLB 里只剩带变换的空节点), 但**单件导出**
# 完全正常. EBF41 实测: 单件 GLB 有完整轮子(4844 面/28×29×28mm), 而它在
# 整机与子装配导出里都是空节点; 该零件是 0 实体+3 曲面体, 缝合成实体也未成功
# (InsertSewRefSurface 三种参数均未形成实体), 所以走"单件素材补回"这条路.
#
# 素材由 tools/export_part_assets.py 单件导出生成, 几何在零件原点坐标系;
# 空节点保留着完整的装配变换, 因此把素材挂上去、局部变换取单位阵即天然对位
# (已用前后渲染对比核对: 两个轮子精确嵌进同步带两端的带圈里).
# 补进去的对象**继承空节点的名字并取代它**, 所以下游按名字的规则
# (materials/rig_map/part_overrides)与零件本来就导出成功时完全一致.
