# ---------------------------------------------------------------------------
# 01_fix_step_names: STEP 名称编码修复
# ---------------------------------------------------------------------------
step_names:
  # SolidWorks 中文版导出的 STEP 把中文名写成裸 GBK 字节(非 ISO-10303-21 的 \X2\ 转义),
  # OCCT 按 UTF-8 解析会得到乱码. 这里先解码再改写成可移植形式.
  source_encoding: "cp936"
  # slug   = 转成拼音 ASCII(工具链最安全, 推荐)
  # escape = 转成 ISO-10303-21 的 \X2\ Unicode 转义(保留中文, 依赖 OCCT 正确解码)
  mode: "slug"
  max_slug_len: 48

# ---------------------------------------------------------------------------
# 02_convert_step: STEP -> GLB
# ---------------------------------------------------------------------------
convert:
  engine: "cascadio"        # cascadio | freecad
  # 网格化公差(单位与 STEP 一致, 本项目为 mm). 整机尺度约 3 m,
  # 0.4 mm 线性公差在屏幕上已看不出棱边, 却能显著降低三角形数量.
  tol_linear: 0.4
  tol_angular: 0.5
  tol_relative: false
  merge_primitives: true
  use_parallel: true
  include_materials: true   # AP214 才有颜色; AP203 源文件此项无效但不报错

# ---------------------------------------------------------------------------
# 05_report: 性能预算(硬门禁)
# ---------------------------------------------------------------------------
budget:
  max_glb_mb: 25
  max_draw_calls: 500
  max_triangles: 3000000
  target_fps: 45
