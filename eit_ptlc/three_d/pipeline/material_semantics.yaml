part_overrides:
  # 零件级覆盖: 零件节点名 -> 观感参数(与 appearance_overrides 同一套字段).
  # 本段由「材质工作台」写回, 每次保存整段重建. 键可写 glTF 原名(中文)或拼音 slug,
  # 管线按 name_variants 双写法 + 空白消毒 + 47 字符截断匹配.
  # 效果: 命中零件以其当前材质为底叠加补丁, 强制生成专属实例 MAT_PART_<slug> ——
  # 该零件因此脱离共享材质, 重跑一次后在合并模型里单独成块, 永久可实时预览.
  # 注意: 每条覆盖约 +1 绘制调用(05_report 有 500 上限门禁), 不宜超过几十条.
