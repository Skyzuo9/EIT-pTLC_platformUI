part_isolate:
  # 孤立清单: 零件原名列表(剥 .00N 后缀的 base 名), 语义="只脱离静态合并、不改观感".
  # 本段由「材质工作台」的"拆出为独立零件"写回, 每次保存整段重建.
  # 效果: 命中零件以当前材质为底生成专属实例 MAT_SOLO_<slug>(观感不变), 合并时因
  # 材质名唯一而独立成块; 同名多实例会一并孤立. 要改观感请改用 part_overrides ——
  # 两段互斥, 重叠键在 build_materials 清洗期丢弃孤立标记并告警.
  # 备注: 04 优化的材质去重会把"参数与类完全相同"的 MAT_SOLO 名折叠回类名,
  # 不影响独立性(几何拆分已在 Blender 侧烘定, 每次重跑都会重演).
  # 注意: 每条约 +1 绘制调用(05_report 有 500 上限门禁), 不宜超过几十条.
  #
  # 下面 25 条全是**柜门相关**: 沙盒 fx/doors.js 要逐扇挂铰链枢轴转, 门体连同骑在门上的
  # 五金都必须脱离静态合并块(合并块只能整体动, 而它们分属 8 扇不同的门).
  #
  # ① 门体 9 件. 名带"固定"的那 4 扇曾被判为"按图纸不可开"而漏掉, 实为误判 ——
  #    CAD 里每扇都带 2 只合页(AKQ41-G-Z-6065)+1 只把手(XAD51-A100), 是真门;
  #    前后长面各 3 扇, 其中 固定门板-5+-6(前) 与 固定门板-2+-3(后) 各是一对对开门.
  - 上料门板-1
  - 侧门-1
  - 侧门-2
  - 侧门板-1
  - 门板-5
  - 固定门板-2
  - 固定门板-3
  - 固定门板-5
  - 固定门板-6
  # ② 门把手 8 只, 每扇一只, 骑在自由边(摆幅最大, 不跟着转就会明显悬在半空).
  #    8 个基名互不相同, 各自独立成节点.
  - XAD51-A100-1
  - XAD51-A100-2
  - XAD51-A100-3
  - XAD51-A100-4
  - XAD51-A100-5
  - XAD51-A100-6
  - XAD51-A100-7
  - XAD51-A100-8
  # ③ 合页门叶 8 组(每扇 2 片). 这些名字**不是 CAD 原名** —— 16 片门叶在 CAD 里同名
  #    (只靠 Blender 的 .00N 区分), 而本段会剥掉 .00N 再去重, 直接写原名等于没写.
  #    故由 blender_clean.rename_door_hinge_leaves() 先按几何(门叶中心落在哪扇门的
  #    门板盒内)改成下面这些稳定名, 再由本段孤立. 同扇门两片同名 -> 同材质 -> 合并成
  #    一个 STATIC_MAT_SOLO_DOOR_HINGE_<门键> 节点(省一半绘制调用, 反正它俩同进同出).
  - DOOR_HINGE_feed
  - DOOR_HINGE_back
  - DOOR_HINGE_sideL1
  - DOOR_HINGE_sideL2
  - DOOR_HINGE_frontL1
  - DOOR_HINGE_frontL2
  - DOOR_HINGE_backL1
  - DOOR_HINGE_backL2
