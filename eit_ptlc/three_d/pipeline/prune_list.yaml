# 功能: Blender 清理阶段(03_clean_model.py)的删减与减面规则.
# 说明: 模式同时覆盖英文、拼音与中文写法, 均为不区分大小写的正则.
#       模型有两种来源, 命名风格不同, 但匹配时两种写法都会试(见 blender_clean.name_variants):
#         原生 GLB(首选) -> SolidWorks 直出的中文实例名, 如 `螺钉-3-4`
#         走 STEP(回退)  -> 01 步转成的拼音 slug, 如 `luo_ding`
#       所以下面的拼音模式对中文名同样有效, 不必重写.
#       匹配对象名时会先剥掉 Blender 自动追加的 .001 后缀.
#
# 装配台的红色从哪来: 不是浏览器自己按下面的规则算的(那样与管线漂移过四类错判),
#       而是 03 的 raw 阶段用同一份裁决(blender_clean.prune_verdict)产出的
#       work/prune_preview.json. 因此**手改本文件的规则档**
#       (delete_patterns / keep_patterns / min_dimension_mm / region_delete)之后,
#       要重跑 raw-swap + raw 两步(约 2 分钟)标红才会跟上; 没跟上时页面顶栏会挂
#       "预览为近似"的告警, 别把那条当噪声。
#       只改 explicit_* 三段名单不需要重跑 —— 那几档由页面实时算。

# ---------------------------------------------------------------------------
# 直接删除: 这些零件在三米开外的整机视角下不可见, 却占据大量三角形与绘制调用
# ---------------------------------------------------------------------------
delete_patterns:
  # SolidWorks 原生 glTF 导出会附带一个名为 current 的相机/视图节点, 不是零件
  - "^current$"

  # 紧固件(螺栓/螺钉/螺母/垫圈/弹垫/销/卡簧)
  - "luo_shuan" # 螺栓
  - "luo_ding" # 螺钉
  - "luo_mu" # 螺母
  - "luo_wen" # 螺纹
  - "dian_quan" # 垫圈
  - "tan_dian" # 弹垫
  - "ping_dian" # 平垫
  - "xiao_zi" # 销子
  - "ding_wei_xiao" # 定位销
  - "ka_huang" # 卡簧
  - "^GB[_\\-]"
  - "^DIN[_\\-]"
  - "^ISO[_\\-]"
  - "^JIS[_\\-]"
  - "\\bM[0-9]+[xX][0-9]+\\b"
  - "screw|bolt|washer|nut\\b|dowel|circlip|retaining_ring"

  # 轴承滚珠/滚柱: 供应商模型里常有上百个独立小球
  - "gun_zhu" # 滚珠
  - "gang_qiu" # 钢球
  - "ball_bearing|roller"

  # 线槽/线缆/拖链内节: 视觉贡献低但数量极多
  - "xian_cao" # 线槽
  - "tuo_lian" # 拖链
  - "cable_chain|drag_chain"

# ---------------------------------------------------------------------------
# 尺寸阈值删除: 小于该尺寸的零散实体一律删掉(单位 mm, 按包围盒最长边判断)
# ---------------------------------------------------------------------------
min_dimension_mm: 6.0

# 但以下模式即使很小也必须保留(状态灯、传感器等语义关键件)
keep_patterns:
  - "chuan_gan_qi" # 传感器
  - "guang_dian" # 光电
  - "san_se_deng" # 三色灯
  - "zhi_shi_deng" # 指示灯
  - "sensor|light|led"

# ---------------------------------------------------------------------------
# 减面: 保留但精简的重型供应商模组
# ---------------------------------------------------------------------------
decimate_rules:
  # 直线模组(丝杆/同步带)细节极高, 但整机视角下只需外形轮廓
  - patterns: [ "^CF[A-Z]?[0-9]", "mo_zu", "si_gan", "tong_bu_dai" ]
    ratio: 0.35
  # OCCT 自动命名的供应商目录件: 名字无语义, 一律重度减面
  - patterns: [ "Open_CASCADE_STEP_translator", "Open CASCADE STEP translator" ]
    ratio: 0.25

# ---------------------------------------------------------------------------
# 区域局部删除: 供应商单体网格里模制的线缆/插头, 按名删会连电机本体一起没,
# 这里按"零件局部坐标毫米区域框"删几何: 整个连通面岛完全落进框内才删 ——
# 机身面岛延伸到框外天然豁免, 因此框可画宽松, 不需要毫米级精确.
# 坐标与实例摆放无关, 同名零件全部实例一次生效. 框由 AI 在 Blender 里探测
# 面岛分布、渲染前后对比核对后写定; 人审说明与对比图即可.
# ---------------------------------------------------------------------------
region_delete:
  # 刮板 Z 轴模组 CFG4-L5-50(拍照刮板工位, 驱动刮取头升降的电机): 数模是单体
  # STEP 导入件, 电机+滑块+丝杆+线缆+插头同属一个网格, 点选无法只选线.
  # 授权来源: 用户在装配台点选后要求"只删线, 不删电机"(2026-07-31).
  - node: "Open CASCADE STEP translator 7.6 18.2-1"
    note: "删两条模制线缆与插头, 保留电机本体/滑块/丝杆/走线罩"
    boxes_mm:
      - { min: [ 18.0, 33.0, 20.5 ], max: [ 61.0, 80.0, 110.0 ] } # 粗线缆管壁+大插头
      - { min: [ -6.0, -6.0, 20.5 ], max: [ 6.0, 13.0, 100.0 ] } # 细线缆+小插头
      - { min: [ 6.5, 75.5, 23.5 ], max: [ 19.7, 87.0, 30.5 ] } # 粗线缆根部斜段(走线罩出口)

  # 上下料 Z 轴模组 CFG12-L5-600(上下料位, 共两套)的电机端块: 同族供应商单体件,
  # 网格含两条模制线缆+插头; 同名两个实例一条规则全生效.
  # 授权来源: 用户看演示视图后要求"把上料部分那个电机的那两个线也删除"(2026-08-01).
  - node: "Open CASCADE STEP translator 7.6 133.2-1"
    note: "删两条模制线缆与插头, 保留电机本体/接线盒/轴头/顶部罩"
    boxes_mm:
      - { min: [ 19.0, 62.5, 32.3 ], max: [ 62.0, 105.0, 119.0 ] } # 粗线缆管壁+大插头
      - { min: [ -6.5, 26.0, 32.3 ], max: [ 6.5, 61.0, 107.0 ] } # 细线缆+小插头
      - { min: [ 6.6, 105.5, 32.3 ], max: [ 17.8, 117.0, 38.9 ] } # 粗线缆根部斜段

  # CFG4-L10-100 与 CFG5-L10-550 模组的电机端块: 与 CFG4-L5-50 的 18.2 是**同一个**
  # 供应商网格(面数/岛分布逐项一致, 实测同框删除数完全相同), 框原样复用.
  # 授权来源: 用户看演示视图后指出水平模组电机的线仍在(2026-08-01), 同族一次清完.
  - node: "Open CASCADE STEP translator 7.6 138.2-1"
    note: "删两条模制线缆与插头(同 18.2 网格, 框复用)"
    boxes_mm:
      - { min: [ 18.0, 33.0, 20.5 ], max: [ 61.0, 80.0, 110.0 ] } # 粗线缆管壁+大插头
      - { min: [ -6.0, -6.0, 20.5 ], max: [ 6.0, 13.0, 100.0 ] } # 细线缆+小插头
      - { min: [ 6.5, 75.5, 23.5 ], max: [ 19.7, 87.0, 30.5 ] } # 粗线缆根部斜段
  - node: "Open CASCADE STEP translator 7.6 82.2-1"
    note: "删两条模制线缆与插头(同 18.2 网格, 框复用)"
    boxes_mm:
      - { min: [ 18.0, 33.0, 20.5 ], max: [ 61.0, 80.0, 110.0 ] } # 粗线缆管壁+大插头
      - { min: [ -6.0, -6.0, 20.5 ], max: [ 6.0, 13.0, 100.0 ] } # 细线缆+小插头
      - { min: [ 6.5, 75.5, 23.5 ], max: [ 19.7, 87.0, 30.5 ] } # 粗线缆根部斜段

  # CFF10-L10-900 模组(T200W)的电机端块: 与 CFG12 的 133.2 同构但机身短 25.2mm,
  # 线缆特征整体沿 Y 平移 -25.2, 框按此平移(逐岛核对过, 试删 49 岛/2694 面干净).
  - node: "Open CASCADE STEP translator 7.6 19.2-1"
    note: "删两条模制线缆与插头(133.2 的框沿 Y 平移 -25.2)"
    boxes_mm:
      - { min: [ 19.0, 37.3, 32.3 ], max: [ 62.0, 79.8, 119.0 ] } # 粗线缆管壁+大插头
      - { min: [ -6.5, 0.8, 32.3 ], max: [ 6.5, 35.8, 107.0 ] } # 细线缆+小插头
      - { min: [ 6.6, 80.3, 32.3 ], max: [ 17.8, 91.8, 38.9 ] } # 粗线缆根部斜段

  # CFG4-L5-300-BL-P100W 模组(抽液机构)的电机件: 该模组电机组拆成 3 个叶子件,
  # 管身(2.2.1.4)与大插头(2.2.1.2)按用户指示走 explicit_delete 整删;
  # 电机件本体网格里还模了一根接线盒引出的裸线管(末端散线芯), 在此只切这根管.
  # 授权来源: 用户在装配台树里点名三件并要求"电机保留, 伸出的管线拆掉"(2026-08-01).
  - node: "Open CASCADE STEP translator 7.6 2.2.1.3-1"
    note: "CFG4-L5-300 电机: 只删接线盒引出的裸线管, 保留电机/接线盒/轴"
    boxes_mm:
      - { min: [ -4.5, 51.5, 32.5 ], max: [ 4.5, 61.5, 71.5 ] } # 裸线管+末端线芯
explicit_delete:
  - 3D_Model_upload_ZKN43-13-C-5-300-1
  - M6111 A02-1
  - Open CASCADE STEP translator 7.6 178.8-1
  - Open CASCADE STEP translator 7.6 178.9-1
  - Open CASCADE STEP translator 7.6 2.2.1.1-1
  - Open CASCADE STEP translator 7.6 2.2.1.2-1
  - Open CASCADE STEP translator 7.6 2.2.1.4-1
  - Open CASCADE STEP translator 7.6 33.1.1-1
  - PTLC-05-003 瓶子阻挡块-1
  - PTLC-05-033 波纹管安装板-1
  - TWA07-C7-R15-15(S0)_cable-1
  - TWA07-C7-R15-3_FIX-1
  - TWA07-C7_FREE-1
  - TWB10-C15-R18-25(S0)_cable-1
  - TWB10-C15-R18-3_fix_1-1
  - TWB10-C15_free_1-1
  - TWD15-C15-R28-20(S0)_cable-1
  - TWD15-C15-R28-3_fix_1-1
  - TWD15-C15-R28-3_free_1-1
  - TWH25-C25-R55-3_fix-1
  - TWH25-C25-R75-13(S0)_cable-1
  - TWH25-C25_free-1
  - TWM25-C57-R55-3_fix_2-1
  - TWM25-C57-R75-50(S0)_base-1
  - TWM25-C57_free_2-1
  # 2026-08-05 按用户指示撤回 `V14T24-50-1-V__3272-00-0100-Z1_装配-1`:
  # rig_map.yaml 把同一个节点列为 axis_6x 的 expect_count: 1 刚体成员(注液电磁阀本体,
  # 挂在随 6X 走的 05-040 安装板背面), 两处直接矛盾 —— 删了它 03 --stage full 就在
  # build_axis_carriages 硬失败("命中 0 个"). 该条目加进来后从没走通过一次构建.
  # 若确实要删这个阀, 必须同时摘掉 rig_map.yaml 里那条成员.
  - ZJF45-SX672-N-5-1
  - ZJF45-SX672-N-5-2
  - ZJF45-SX672-N-5-3
  - ZJF45-SX672-N-5-4
  - mesh_2024
  - 为盛机电  F050SH-L600B-40  显示器键盘支架-1
