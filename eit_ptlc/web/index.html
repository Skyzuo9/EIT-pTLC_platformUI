<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pTLC 上位机</title>
    <!-- 浏览器 UI (地址栏/任务切换卡) 底色跟随主题; content 由下方内联脚本与 theme store 同步改写 -->
    <meta name="theme-color" content="#f5f6f8" />
    <script>
      // 首屏防闪烁: Vue 挂载前同步把已存主题写到 <html data-theme>, 缺省浅色
      (function () {
        try {
          var saved = localStorage.getItem('ptlc.theme')
          var theme = saved === 'dark' ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.content = theme === 'dark' ? '#0f1522' : '#f5f6f8'
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
