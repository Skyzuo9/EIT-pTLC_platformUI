schema: ptlc.script/v1
kind: operation
name: transfer_spotting_to_scrape
# [已退役 R2] 刮板/feedlift 侧并入 cycle, 不再被 recipe 引用。
#   刮板放板段并入 06_photoscrape/photoscrape_place; 上样取板 (robot_suction_pick spotting) 跨站 transport 归 recipe。
#   保留文件 (git 历史 + test_stations_l2)。
label: 转运-上样→刮板拍照 (上位机)
# 重规划自路线 plate.spotting-to-scrape. 上样位1 -> 刮板拍照位2.
vars: []
resources: [robot, "station:sampling", "station:photoscrape"]
body:
  - {op: comment, text: 地轨到上样区(位1); 从上样取板}
  - {op: call, action: rail.move, args: {Rail_Target_Position: {lit: 1}}, mode: RUN}
  - {op: run_script, script: robot_suction_pick, inputs: {station_id: {lit: spotting}}, outputs: {}}
  - {op: comment, text: 地轨到刮板拍照区(位2); 备位+放板+定位夹紧}
  - {op: call, action: rail.move, args: {Rail_Target_Position: {lit: 2}}, mode: RUN}
  - {op: call, action: photoscrape.cam_x335, mode: RUN}
  - {op: run_script, script: robot_suction_put, inputs: {station_id: {lit: scrape}}, outputs: {}}
  - {op: call, action: photoscrape.cam_locate, mode: RUN}
  - {op: comment, text: 展开前拍照占位 (camera 非可执行 kind)}
