schema: ptlc.script/v1
kind: operation
name: transfer_feed_to_spotting
# [已退役 R2] 刮板/feedlift 侧并入 cycle, 不再被 recipe 引用。
#   升降取料段并入 08_feedlift/feedlift_load_cycle; 上样放板段并入 03_sampling/sampling_cycle。
#   保留文件 (git 历史 + test_stations_l2)。
label: 转运-升降上料→上样 (上位机)
# 由 robot_flows_v2 路线 plate.feed-to-spotting 重规划为上位机 VM 流程:
#   地轨到位 + 机器人点位 operation 取放 + 端点设备握手 (设备握手映射 best-effort, 真机待点位/握手验收).
#   升降上料与上样同地轨位(位1). camera 标定非可执行 kind, 占位注释.
vars: []
resources: [robot, "station:feedlift", "station:sampling"]
body:
  - {op: comment, text: 地轨到上样区(位1); 机器人进升降取料}
  - {op: call, action: rail.move, args: {Rail_Target_Position: {lit: 1}}, mode: RUN}
  - {op: run_script, script: robot_feed_lift_pick_enter, inputs: {station_id: {lit: default}}, outputs: {}}
  - {op: call, action: feedlift.feed_raise, mode: RUN}
  - {op: run_script, script: robot_feed_lift_pick_exit, inputs: {station_id: {lit: default}}, outputs: {}}
  - {op: call, action: feedlift.feed_lower, mode: RUN}
  - {op: comment, text: 相机标定占位 (camera 非可执行 kind)}
  - {op: comment, text: 上样备料 + 放板到上样位 + 定位夹紧}
  - {op: call, action: sampling.place_axis, mode: RUN}
  - {op: run_script, script: robot_suction_put, inputs: {station_id: {lit: spotting}}, outputs: {}}
  - {op: call, action: sampling.place_locate, mode: RUN}
