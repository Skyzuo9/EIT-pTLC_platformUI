schema: ptlc.script/v1
kind: operation
name: transfer_scrape_to_tank
# [已退役 R2] 刮板/feedlift 侧并入 cycle, 不再被 recipe 引用。
#   刮板取板段并入 06_photoscrape/photoscrape_pick; develop.* 全部并入 04_develop/develop_cycle。
#   保留文件 (git 历史 + test_stations_l2)。
label: 转运-刮板拍照→展开缸 (上位机, 参 tank_id)
# 重规划自路线 plate.scrape-to-tank. 刮板位2 -> 展开位5. 放板由 plate_retract->[放]->plate_extend.
vars:
  - {name: tank_id, scope: local, type: INT, io: in, default: 1, comment: 目标缸号 1-8}
resources: [robot, "station:photoscrape", "station:develop"]
body:
  - {op: comment, text: 地轨到刮板区(位2); 松下压+从刮板取板}
  - {op: call, action: rail.move, args: {Rail_Target_Position: {lit: 2}}, mode: RUN}
  - {op: call, action: photoscrape.retr_release, mode: RUN}
  - {op: run_script, script: robot_suction_pick, inputs: {station_id: {lit: scrape}}, outputs: {}}
  - {op: comment, text: 地轨到展开区(位5); 选缸+让位+放板到目标缸+夹持到位}
  - {op: call, action: rail.move, args: {Rail_Target_Position: {lit: 5}}, mode: RUN}
  - {op: call, action: develop.init, args: {target_tank: {var: tank_id}}, mode: RUN}
  - {op: call, action: develop.plate_retract, args: {target_tank: {var: tank_id}}, mode: RUN}
  - {op: run_script, script: robot_tank_put, inputs: {tank_id: {var: tank_id}}, outputs: {}}
  - {op: call, action: develop.plate_extend, args: {target_tank: {var: tank_id}}, mode: RUN}
