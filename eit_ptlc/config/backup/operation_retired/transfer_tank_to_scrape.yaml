schema: ptlc.script/v1
kind: operation
name: transfer_tank_to_scrape
# [已退役 R2] 刮板/feedlift 侧并入 cycle, 不再被 recipe 引用。
#   develop.* 全部并入 04_develop/develop_cycle (含出缸 robot_tank_pick); 刮板放板段并入 06_photoscrape/photoscrape_place。
#   保留文件 (git 历史 + test_stations_l2)。
label: 转运-展开缸→刮板拍照 (上位机, 参 tank_id)
# 重规划自路线 plate.tank-to-scrape. 展开位5 -> 刮板位2.
vars:
  - {name: tank_id, scope: local, type: INT, io: in, default: 1, comment: 目标缸号 1-8}
resources: [robot, "station:develop", "station:photoscrape"]
body:
  - {op: comment, text: 地轨到展开区(位5); 选缸+从目标缸取板+缸回原点}
  - {op: call, action: rail.move, args: {Rail_Target_Position: {lit: 5}}, mode: RUN}
  - {op: call, action: develop.init, args: {target_tank: {var: tank_id}}, mode: RUN}
  - {op: run_script, script: robot_tank_pick, inputs: {tank_id: {var: tank_id}}, outputs: {}}
  - {op: call, action: develop.plate_retract, args: {target_tank: {var: tank_id}}, mode: RUN}
  - {op: comment, text: 地轨到刮板区(位2); 备位+放板+定位夹紧}
  - {op: call, action: rail.move, args: {Rail_Target_Position: {lit: 2}}, mode: RUN}
  - {op: call, action: photoscrape.cam_x335, mode: RUN}
  - {op: run_script, script: robot_suction_put, inputs: {station_id: {lit: scrape}}, outputs: {}}
  - {op: call, action: photoscrape.cam_locate, mode: RUN}
  - {op: comment, text: 展开后拍照占位 (camera 非可执行 kind)}
