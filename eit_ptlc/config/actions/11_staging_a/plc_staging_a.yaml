# StagingA_L2 atomic actions.
# PLC contract 2026-07-03: one L2 station owns both staging A/B locator targets.

staging_a.locator_a:
  kind: plc_l2
  station: staging_a
  action_code: 24
  label: 中转A-定位气缸目标态
  desc: |-
    执行步骤：把target写入StagingA_LocatorA_Target；StagingA_L2动作码24将“粉末收集器定位自动”直接赋为该值，把Step置99并在同一扫描周期进入DONE。
    前置与安全：PLC须处于运行/就绪态；定位前物料正确落座且机器人退出气缸运动区，松开后物料不再受定位约束。PLC不检查这些编排前置。
    完成与异常：DONE只表示定位输出已写入，不读取原点/动点反馈，也不生成气缸错误；Reset在运行态会返回INTERRUPTED/ErrorCode 402。
    PLC核对：现役 20260702.project，Application/50_action/StagingA_L2 动作码24内联逻辑；PLC_MainPRG已周期调用。
  modes: []
  params:
    - {name: target, type: bool, required: true, channel: StagingA_LocatorA_Target, label: 中转A定位气缸目标}

staging_a.locator_b:
  kind: plc_l2
  station: staging_a
  action_code: 25
  label: 中转B-定位气缸目标态
  desc: |-
    执行步骤：把target写入StagingA_LocatorB_Target；StagingA_L2动作码25将“溶液收集瓶定位自动”直接赋为该值，把Step置99并在同一扫描周期进入DONE。
    前置与安全：PLC须处于运行/就绪态；中转B不是独立L2工位，气缸由StagingA_L2管理。定位/松开前物料与机器人安全由编排保证。
    完成与异常：DONE只表示定位输出已写入，不读取原点/动点反馈，也不生成气缸错误；Reset在运行态会返回INTERRUPTED/ErrorCode 402。
    PLC核对：现役 20260702.project，Application/50_action/StagingA_L2 动作码25内联逻辑；PLC_MainPRG已周期调用。
  modes: []
  params:
    - {name: target, type: bool, required: true, channel: StagingA_LocatorB_Target, label: 中转B定位气缸目标}
