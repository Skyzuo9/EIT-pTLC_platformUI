version: 1
# 孔板类型 (现场可扩展/覆盖)。物理 mm 间距由 3 个标定点决定, 故无需登记;
# nominal_pitch_* 仅供标定结果 >10% 偏差自检 (防选错孔), 不参与算点, 可缺省。
# calib_wells: 推荐操作员对点的 3 个孔 [row, col], 须不共线 (默认取三角)。
# 行用字母(A=行1), 列用数字; 如 4×6 角孔 A1=[1,1] / A6=[1,6] / D1=[4,1]。
plates:
  - name: "4×6"            # 上样区规格: 4 行(A-D) × 6 列(1-6)
    rows: 4
    cols: 6
    row_major: true        # 孔序行优先 (A1,A2,...,A6,B1,...)
    calib_wells: [[1, 1], [1, 6], [4, 1]]   # A1 / A6 / D1 三角
    # ⚠ 2026-08-06 订正: 原为 19.3 —— 那是**细胞培养板**的孔距, 而上样区装的是
    # 24 方孔**深孔板**(A-GEN P-10-SQV-24 / P-15-SQV-24), 厂商表两个规格都是 18.00。
    # 参照错了的后果是自检失灵: 列距 18.0 vs 19.3 只差 6.7%, 压在 10% 阈值下**不报**;
    # 而行距 9.0(4X 那根轴"控制侧 1mm = 物理 2mm", 见
    # docs/上样4X_5Z临时标度增益_换伺服后作废_20260806.md)差得多才报出来 ——
    # 于是唯一喊出来的那条告警, 参照本身却是不可信的, 没人当真。
    # 改成 18.0 之后: 列距 0% 偏差、行距 50% 偏差, 这条告警才成为**可信信号**。
    nominal_pitch_x_mm: 18.0
    nominal_pitch_y_mm: 18.0

  - name: "6×8"            # 上样区规格: 6 行(A-F) × 8 列(1-8)
    rows: 6
    cols: 8
    row_major: true        # 孔序行优先 (A1,A2,...,A8,B1,...)
    calib_wells: [[1, 1], [1, 8], [6, 1]]   # A1 / A8 / F1 三角
    # nominal_pitch_* 现场实测后填入即可启用 >10% 偏差自检 (缺省=不自检)
