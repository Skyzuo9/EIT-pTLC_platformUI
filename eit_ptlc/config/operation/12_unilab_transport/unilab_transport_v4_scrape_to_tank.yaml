schema: ptlc.script/v1
kind: operation
name: unilab_transport_v4_scrape_to_tank
label: v4 转运 刮板台→展开缸
ui:
  role: unilab_transport_v4
  projection_only: true
vars:
- name: tank
  scope: local
  type: INT
  io: in
  default: 1
resources:
- robot
- station:rail
- station:photo_scrape
- station:develop
body:
- op: run_script
  script: photoscrape_unload
  inputs: {}
  outputs: {}
- op: run_script
  script: rail_move_safe
  inputs:
    target:
      lit: 5
  outputs: {}
- op: run_script
  script: develop_load
  inputs:
    tank:
      var: tank
  outputs: {}
