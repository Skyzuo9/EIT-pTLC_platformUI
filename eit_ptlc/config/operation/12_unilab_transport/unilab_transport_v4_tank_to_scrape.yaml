schema: ptlc.script/v1
kind: operation
name: unilab_transport_v4_tank_to_scrape
label: v4 转运 展开缸→刮板台
ui:
  role: unilab_transport_v4
  projection_only: true
vars:
- name: tank
  scope: local
  type: INT
  io: in
  default: 1
resources:
- robot
- station:rail
- station:develop
- station:photo_scrape
body:
- op: run_script
  script: develop_unload
  inputs:
    tank:
      var: tank
  outputs: {}
- op: run_script
  script: photoscrape_prepare
  inputs: {}
  outputs: {}
- op: run_script
  script: photoscrape_plate_load
  inputs: {}
  outputs: {}
