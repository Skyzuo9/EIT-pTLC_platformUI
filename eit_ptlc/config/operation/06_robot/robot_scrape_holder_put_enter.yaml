# 由 tools/gen_robot_point_operations.py 从 robot_flows_v2.yaml 模板 scrape.holder.put-enter 生成
# 点位驱动: 可直接编辑各步点位/速度档; 进/出 require_anchor 为安全门
# 【手改·勿重生成 (G-1)】body 顶部入口保证 prologue: home_ensure 确保回零 + tool_ensure 换刀 (needed=3 小夹爪); 生成器重跑会抹掉
schema: ptlc.script/v1
kind: operation
name: robot_scrape_holder_put_enter
label: 刮板工位放收集器-进入
note: '1/2 进入到位, 待 PLC 夹紧'
ui: {subgroup: 刮板工位, order: 43}
vars:
- {name: station_id, scope: local, type: STRING, io: in, default: default, comment: scrape.holder.put-enter 主选择值, enum: [default]}
resources: [robot]
body:
- {op: comment, text: '入口保证(手改): 确保在 home (安全邻域内自动回零) + 智能换刀到本流程固定工具 (小夹爪)'}
- {op: call, action: robot.home_ensure, mode: RUN}
- {op: run_script, script: robot_tool_ensure, inputs: {needed: {lit: 3}}, outputs: {}}
- op: if
  cond:
    binop: ==
    left: {var: station_id}
    right: {lit: default}
  then:
  - op: call
    action: robot.require_anchor
    args:
      point_id: {lit: P1}
      joint_tol_deg: {lit: 2.0}
      pos_tol_mm: {lit: 5.0}
      rot_tol_deg: {lit: 5.0}
    mode: RUN
  - op: call
    action: rail.ensure
    args:
      Rail_Target_Position: {lit: 2}
    mode: RUN
  - op: call
    action: robot.move_to_point
    args:
      point_id_or_robot_name: {lit: P67}
      motion: {lit: move_j}
      acc: {lit: 60}
      vel: {lit: 50}
      cp: {lit: 20}
    mode: RUN
  - op: call
    action: robot.move_to_point
    args:
      point_id_or_robot_name: {lit: scrape-holder-put.far}
      motion: {lit: move_l}
      acc: {lit: 60}
      vel: {lit: 50}
      cp: {lit: 20}
    mode: RUN
  - op: call
    action: robot.move_to_point
    args:
      point_id_or_robot_name: {lit: scrape-holder-put.near}
      motion: {lit: move_l}
      acc: {lit: 6}
      vel: {lit: 10}
      cp: {lit: 0}
    mode: RUN
  - op: call
    action: robot.move_to_point
    args:
      point_id_or_robot_name: {lit: P68}
      motion: {lit: move_l}
      acc: {lit: 6}
      vel: {lit: 5}
      cp: {lit: 0}
    mode: RUN
  - op: comment
    text: '[手改 #3 planB] 微调对位(x±/y±)前移至此: 放到位后先精定位, 再由 transfer 触发 press_cylinder(true) 夹紧, 最后 put_exit 松爪退回'
  - op: call
    action: robot.move_to_point
    args:
      point_id_or_robot_name: {lit: scrape-holder-put.x-plus}
      motion: {lit: move_l}
      acc: {lit: 6}
      vel: {lit: 5}
      cp: {lit: 0}
    mode: RUN
  - op: call
    action: robot.move_to_point
    args:
      point_id_or_robot_name: {lit: scrape-holder-put.x-minus}
      motion: {lit: move_l}
      acc: {lit: 6}
      vel: {lit: 5}
      cp: {lit: 0}
    mode: RUN
  - op: call
    action: robot.move_to_point
    args:
      point_id_or_robot_name: {lit: P68}
      motion: {lit: move_l}
      acc: {lit: 6}
      vel: {lit: 5}
      cp: {lit: 0}
    mode: RUN
  - op: call
    action: robot.move_to_point
    args:
      point_id_or_robot_name: {lit: scrape-holder-put.y-minus}
      motion: {lit: move_l}
      acc: {lit: 6}
      vel: {lit: 5}
      cp: {lit: 0}
    mode: RUN
  - op: call
    action: robot.move_to_point
    args:
      point_id_or_robot_name: {lit: scrape-holder-put.y-plus}
      motion: {lit: move_l}
      acc: {lit: 6}
      vel: {lit: 5}
      cp: {lit: 0}
    mode: RUN
  - op: call
    action: robot.move_to_point
    args:
      point_id_or_robot_name: {lit: P68}
      motion: {lit: move_l}
      acc: {lit: 6}
      vel: {lit: 5}
      cp: {lit: 0}
    mode: RUN
  - op: call
    action: robot.require_anchor
    args:
      point_id: {lit: P68}
      joint_tol_deg: {lit: 2.0}
      pos_tol_mm: {lit: 5.0}
      rot_tol_deg: {lit: 5.0}
    mode: RUN
  elifs: []
  else:
  - op: raise
    error: ROBOT_FLOW_SELECTOR
    message: {lit: 'scrape.holder.put-enter: 无效选择值'}
