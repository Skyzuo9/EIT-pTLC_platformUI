# 点位驱动: 可直接编辑各步点位/速度档; 进/出 require_anchor 为安全门
# 【手改·勿重生成 (G-1)】body 顶部入口保证 prologue: home_ensure 确保回零 + tool_ensure 换刀 (needed=2 大夹爪); 生成器重跑会抹掉
schema: ptlc.script/v1
kind: operation
name: robot_group_rack_pick
label: 货架取整组
note: '大夹爪; 收集器组/瓶组, 位 1-6'
ui: {subgroup: 货架, order: 71}
vars:
- {name: rack_id, scope: local, type: STRING, io: in, default: collector, comment: group-rack.pick 主选择值, enum: [collector, bottle]}
- {name: slot_id, scope: local, type: INT, io: in, default: 1, comment: group-rack.pick 次选择值, enum: [1, 2, 3, 4, 5, 6]}
resources: [robot]
body:
