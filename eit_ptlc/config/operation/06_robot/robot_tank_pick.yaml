# 由 tools/gen_robot_point_operations.py 从 robot_flows_v2.yaml 模板 tank.pick 生成
# 点位驱动: 可直接编辑各步点位/速度档; 进/出 require_anchor 为安全门
# 【手改·勿重生成 (G-1)】body 顶部入口保证 prologue: home_ensure 确保回零 + tool_ensure 换刀 (needed=1 吸盘); 生成器重跑会抹掉
# 【手改·勿重生成 (G-2)】每条分支 entry require_anchor(P1) 之后的 rail.ensure(5): 地轨到位是本原子的前置条件,
#   必须在臂仍缩在 P1 时完成 —— 缸内点 (P11-P18/tank.N.*) 为 rail=5, 而中途点 P75/P84/P59 为 rail=None,
#   缺此步则 auto_rail 要到臂已伸出取板时才发现需移轨, 届时 rail.move 的 P1 硬门只能拒 (真空守卫)。生成器重跑会抹掉
schema: ptlc.script/v1
kind: operation
name: robot_tank_pick
label: 展缸取板
note: '吸盘; 缸 1-8'
ui: {subgroup: 展缸, order: 31}
vars:
- {name: tank_id, scope: local, type: INT, io: in, default: 1, comment: tank.pick 主选择值, enum: [1, 2, 3, 4, 5, 6, 7, 8]}
resources: [robot]
body:
