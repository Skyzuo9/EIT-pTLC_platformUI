      args:
        action:
          lit: rotary-down
        timeout_ms:
          lit: 3000
      mode: RUN
    - op: call
      action: robot.move_to_point
      args:
        point_id_or_robot_name:
          lit: P1
        motion:
          lit: move_j
        acc:
          lit: 50
        vel:
          lit: 37
        cp:
          lit: 2
