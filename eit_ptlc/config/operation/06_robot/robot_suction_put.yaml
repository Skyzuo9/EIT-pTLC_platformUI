    - op: call
      action: robot.move_to_point
      args:
        point_id_or_robot_name:
          lit: P63
        motion:
          lit: move_j
        acc:
          lit: 60
        vel:
          lit: 50
        cp:
          lit: 20
      mode: RUN
    - op: call
      action: robot.move_to_point
      args:
        point_id_or_robot_name:
          lit: scrape.plate-put.approach_far
        motion:
          lit: move_l
        acc:
          lit: 12
        vel:
          lit: 15
        cp:
          lit: 0
      mode: RUN
    - op: call
      action: robot.move_to_point
      args:
        point_id_or_robot_name:
          lit: scrape.plate-put.approach_near
        motion:
