# 由 tools/gen_robot_point_operations.py 从 robot_flows_v2.yaml 模板 individual.pick 生成
# 点位驱动: 可直接编辑各步点位/速度档; 进/出 require_anchor 为安全门
# 【手改·勿重生成 (G-1)】body 顶部入口保证 prologue: home_ensure 确保回零 + tool_ensure 换刀 (needed=3 小夹爪); 生成器重跑会抹掉
schema: ptlc.script/v1
kind: operation
name: robot_individual_pick
label: 中转台取单件
note: '小夹爪; 收集器/瓶, 位 1-6'
ui: {subgroup: 中转台, order: 63}
vars:
- {name: rack_id, scope: local, type: STRING, io: in, default: collector, comment: individual.pick 主选择值, enum: [collector, bottle]}
- {name: slot_id, scope: local, type: INT, io: in, default: 1, comment: individual.pick 次选择值, enum: [1, 2, 3, 4, 5, 6]}
# 出口锚点: 默认 P1=Home (自成一体, 与既有调用者一致); 瓶分支交接式转运可传 P52=中转B枢纽, 取毕停 P52 直接交给 collect_bottle_put 放瓶, 免回家 (对称于下料 collect_bottle_pick 出锚 P70; 收集器分支不接线仍锚 P1)
- {name: exit_anchor, scope: local, type: STRING, io: in, default: P1, comment: 出口锚点 (默认 P1=Home; 瓶分支可传 P52 交接)}
resources: [robot]
body:
- {op: comment, text: '入口保证(手改): 确保在 home (安全邻域内自动回零) + 智能换刀到本流程固定工具 (小夹爪)'}
- {op: call, action: robot.home_ensure, mode: RUN}
- {op: run_script, script: robot_tool_ensure, inputs: {needed: {lit: 3}}, outputs: {}}
- op: if
  cond:
    binop: and
    left:
      binop: ==
      left: {var: rack_id}
      right: {lit: collector}
    right:
      binop: ==
      left: {var: slot_id}
      right: {lit: 1}
  then:
  - op: call
    action: robot.require_anchor
    args:
      point_id: {lit: P1}
      joint_tol_deg: {lit: 2.0}
      pos_tol_mm: {lit: 5.0}
      rot_tol_deg: {lit: 5.0}
    mode: RUN
  - op: call
    action: rail.ensure
    args:
      Rail_Target_Position: {lit: 2}
    mode: RUN
  - op: call
    action: robot.move_to_point
    args:
      point_id_or_robot_name: {lit: P45}
      motion: {lit: move_j}
      acc: {lit: 60}
      vel: {lit: 50}
      cp: {lit: 20}
    mode: RUN
  - op: call
    action: robot.move_to_point
    args:
      point_id_or_robot_name: {lit: staging-a.p46.high}
      motion: {lit: move_l}
      acc: {lit: 12}
      vel: {lit: 15}
      cp: {lit: 0}
    mode: RUN
  - op: call
    action: robot.tool_action
    args:
      action: {lit: gripper-open}
      timeout_ms: {lit: 3000}
    mode: RUN
  - op: call
    action: robot.move_to_point
    args:
      point_id_or_robot_name: {lit: staging-a.p46.near}
      motion: {lit: move_l}
      acc: {lit: 6}
