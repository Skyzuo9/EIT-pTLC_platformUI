  cond: {binop: ==, left: {var: enter_anchor}, right: {lit: P1}}
  then:
  - {op: call, action: robot.home_ensure, mode: RUN}
  - {op: run_script, script: robot_tool_ensure, inputs: {needed: {lit: 3}}, outputs: {}}
- op: if
  cond:
    binop: ==
    left: {var: slot_id}
    right: {lit: 1}
  then:
  - op: call
    action: robot.require_anchor
    args:
      point_id: {var: enter_anchor}
      joint_tol_deg: {lit: 2.0}
      pos_tol_mm: {lit: 5.0}
      rot_tol_deg: {lit: 5.0}
    mode: RUN
  - op: call
    action: robot.move_to_point
    args:
      point_id_or_robot_name: {lit: P45}
      motion: {lit: move_j}
      acc: {lit: 60}
      vel: {lit: 50}
      cp: {lit: 20}
    mode: RUN
  - op: call
    action: robot.move_to_point
    args:
      point_id_or_robot_name: {lit: staging-a-return.p78.high}
      motion: {lit: move_l}
