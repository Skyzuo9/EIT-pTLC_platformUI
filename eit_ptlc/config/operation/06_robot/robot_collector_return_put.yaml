# 由 tools/gen_robot_point_operations.py 从 robot_flows_v2.yaml 模板 collector.return.put 生成
# 点位驱动: 可直接编辑各步点位/速度档; 进/出 require_anchor 为安全门
# 【手改·勿重生成 (G-1)】body 顶部条件式入口保证 prologue: 仅 enter_anchor==P1 时 home_ensure + tool_ensure (needed=3 小夹爪); 生成器重跑会抹掉
schema: ptlc.script/v1
kind: operation
name: robot_collector_return_put
label: 中转A放回单收集器
note: '小夹爪; 位 1-6'
ui: {subgroup: 中转台, order: 65}
vars:
- {name: slot_id, scope: local, type: INT, io: in, default: 1, comment: collector.return.put 主选择值, enum: [1, 2, 3, 4, 5, 6]}
# 入口锚点: 默认 P1=Home (自成一体); collect_unload 传 P70=收集枢纽, 从 holder_pick_exit 停留处直接接手, 免 P70→P1→P45 空跑
- {name: enter_anchor, scope: local, type: STRING, io: in, default: P1, comment: 入口锚点 (默认 P1=Home; collect_unload 传 P70 交接)}
resources: [robot]
body:
- {op: comment, text: '入口保证(手改): 仅 P1 入口时确保回零+换刀; P70 交接入口由分支锚断言把关 (上游取件流程已保证工具)'}
