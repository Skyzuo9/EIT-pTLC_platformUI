version: 1
# 机器人点位中文显示名 (纯展示, 不参与寻址/运动; 改此文件不影响任何流程)。
#
# key 约定 (刻意不用 alias: 单点编辑允许改 alias 且会连带改 point_id, 拿它当 key 会静默失配):
#   - points:  基础示教点与网格库位 -> 按 robot_name (P 号, 禁改) 索引。
#   - derived: 派生点 -> 按 point_id (禁改) 索引; 仅登记"自动生成会撞名/失真"的条目。
#   - suffixes: 覆盖内置末段后缀表 (见 point_registry._TAIL_LABEL_SUFFIXES)。
#
# 派生点未在 derived 登记时自动生成: 基点中文名 + point_id 末段后缀
#   (如 tank.3.approach_far -> "3号展开缸" + "·远接近")。基点无中文名则留空, 前端回退英文 alias。
#
# 数据来源: 机器人程序/越疆机器人点位表.md (Area 3-11 权威) + 06_robot 流程语义交叉验证。
# 下列标 [待现场确认] 的为按流程语义推断 (点位表未覆盖 Area 1/2 与部分过渡/备用点)。

