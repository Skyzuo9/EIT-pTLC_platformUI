derived:
  # 仅登记自动生成会撞名的家族: put 与 pick 共用同一基点, 自动生成会得到两个一模一样的名字。
  # 其余 ~137 条派生点 (tank / group-rack / staging-a(-return) / staging-b / feed-lift /
  # waste / collect-* / scrape-holder-* / tool-change) 基点各不相同, 走自动生成即唯一。

  # 点样工位: put 与 pick 均以 P19 为基点
  spotting.put.approach_far: "点样放板·远接近"
  spotting.put.approach_near: "点样放板·近接近"
  spotting.put.retreat_near: "点样放板·近退离"
  spotting.put.retreat_far: "点样放板·远退离"
  spotting.pick.approach_far: "点样取板·远接近"
  spotting.pick.approach_near: "点样取板·近接近"
  spotting.pick.retreat_near: "点样取板·近退离"
  spotting.pick.retreat_far: "点样取板·远退离"

  # 刮板台面: plate-put 与 plate-pick 均以 P65 为基点
  scrape.plate-put.approach_far: "刮板台放板·远接近"
  scrape.plate-put.approach_near: "刮板台放板·近接近"
  scrape.plate-put.retreat_near: "刮板台放板·近退离"
  scrape.plate-put.retreat_far: "刮板台放板·远退离"
  scrape.plate-pick.approach_far: "刮板台取板·远接近"
  scrape.plate-pick.approach_near: "刮板台取板·近接近"
  scrape.plate-pick.retreat_near: "刮板台取板·近退离"
  scrape.plate-pick.retreat_far: "刮板台取板·远退离"

suffixes: {}
