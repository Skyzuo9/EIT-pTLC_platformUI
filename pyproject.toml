[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eit_ptlc"
version = "0.1.0"
description = "pTLC 全自动平台统一上位机控制 (config/driver/controller/action/operation/api 分层)"
requires-python = ">=3.10"
dependencies = [
    # 下界钉 2.0.1: 驱动按 2.x 的连接监管语义写 (Client 的 timeout/watchdog_intervall/
    # auto_reconnect 显式给, 见 driver/opcua_driver.py _new_client)。上界排除 3.x:
    # 原来写 >=1.0.0 却实装 2.0.1, 驱动却是照 1.x 写的, 正是现场断连churn 的制度性成因。
    "asyncua>=2.0.1,<3",
    "PyYAML>=6.0",
    "opencv-python>=4.9.0",
    "numpy>=1.26.0",
    "Pillow>=10.0.0",
    "matplotlib>=3.8.0",
    "aiosqlite>=0.19.0",
    "paho-mqtt>=2.0.0",
    "fastapi>=0.110",
    "httpx>=0.27",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "websockets>=12.0",
    # 状态录像 (runtime/recording): 列式块的容器与压缩。这两个此前只是碰巧装在
    # miniforge 基础环境里而没有声明, .venv 里根本没有 —— 不写进来, 换个环境就起不来。
    "msgpack>=1.0",
    "zstandard>=0.21",
    "ruamel.yaml>=0.18",
    "python-multipart>=0.0.20",
]

[tool.unilabos.startup]
graph = "deployment/graphs/ptlc-platformui-local-debug.json"
config = "deployment/local_config.py"
app_bridges = ["fastapi"]
ensure_dependencies = false

[tool.setuptools.packages.find]
include = ["eit_ptlc*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"eit_ptlc" = [
    "config/*.yaml",
    "config/*.json",
    "config/actions/**/*.yaml",
    "config/operation/**/*.yaml",
    "driver/gxipy/native/win64/*",
    "driver/gxipy/native/win64/apidll/*",
    "driver/gxipy/native/win64/genicam/*",
    "driver/gxipy/native/win64/gentl/*",
    "driver/dobot_tcp_v4/*",
    "driver/dobot_tcp_v4/files/*",
    "driver/water_level_payload/*",
    "three_d/*.yaml",
    "three_d/*.md",
    "three_d/models/*",
    "three_d/clips/*",
    "three_d/generated/*",
    "three_d/pipeline/*.py",
    "three_d/pipeline/*.mjs",
    "three_d/pipeline/*.yaml",
    "three_d/pipeline/*.json",
    "three_d/pipeline/calibration/*",
    "three_d/docs/*.md",
    "three_d/mcp_servers/**/*.py",
    "three_d/tools/**/*.py",
    "web/src/three-d/twin/bindings/TrayBinding.js",
    "web/src/three-d/twin/bindings/plateTraceState.js",
    "web/src/three-d/twin/scene/MaterialPickController.js",
    "web/src/three-d/twin/scene/plates/PlateFaceLayer.js",
    "web/src/three-d/twin/scene/plates/plateGeometry.js",
    "unilab_domain/generated/*.yaml",
    "unilab_domain/templates/*.tmpl",
]
"eit_ptlc.config" = [
    "*.yaml",
    "*.json",
    "actions/**/*.yaml",
    "operation/**/*.yaml",
]
"eit_ptlc.driver" = [
    "dobot_tcp_v4/*",
    "dobot_tcp_v4/files/*",
    "water_level_payload/*",
]
"eit_ptlc.driver.gxipy" = [
    "native/win64/*",
    "native/win64/apidll/*",
    "native/win64/genicam/*",
    "native/win64/gentl/*",
]
